<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>صقور الجديان | نظام الكاشير والمحاسبة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+Ethiopic:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
:root{
  color-scheme:dark;
  --bg:#0A1A33;--bg2:#0D2142;--panel:#112950;--panel2:#17335F;--line:#25497A;
  --ice:#6CCBFF;--ice2:#B4E6FF;--text:#EAF3FF;--muted:#91A9CB;
  --red:#D21034;--red2:#FF5C78;--green:#007229;--green2:#2FC872;--warn:#F5B942;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A1A33}}
:root[data-theme="dark"]{--bg:#0A1A33}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:"IBM Plex Sans Arabic","IBM Plex Sans","Noto Sans Ethiopic",Tahoma,"Segoe UI",Arial,sans-serif;font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
.num,.stat .v,td.n{font-variant-numeric:tabular-nums}
svg.i{width:24px;height:24px;stroke:var(--ice);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.muted{color:var(--muted)}
h2{font-size:20px;margin:0 0 12px}h3{font-size:17px;margin:0}

/* Sudan flag band: red / white / black with the green hoist triangle */
.flag{height:7px;flex:none;position:relative;background:linear-gradient(to bottom,var(--red) 0 33.4%,#fff 33.4% 66.6%,#000 66.6%)}
.flag::before{content:"";position:absolute;left:0;top:0;bottom:0;width:22px;background:var(--green);clip-path:polygon(0 0,100% 50%,0 100%)}

#app{height:100%;display:grid;grid-template-columns:96px 1fr}
.side{background:var(--bg2);border-inline-end:1px solid var(--line);display:flex;flex-direction:column;align-items:stretch;gap:4px;padding:12px 8px;overflow-y:auto}
.side .emb{width:52px;height:52px;margin:0 auto 10px}
.nav{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px;border:0;border-radius:12px;background:none;color:var(--muted);font-size:12.5px;cursor:pointer;border-inline-start:3px solid transparent}
.nav:hover{background:var(--panel)}
.nav.on{background:var(--panel2);color:var(--text);border-inline-start-color:var(--red)}
.nav svg.i{width:27px;height:27px}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:12px;padding:10px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.top h1{font-size:19px;margin:0;font-weight:700}
.top .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;font-size:13px;border:1px solid var(--line);background:var(--bg2)}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.pill.ok::before{background:var(--green2)}.pill.no::before{background:var(--red)}
.content{flex:1;overflow:auto;padding:18px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:11px;padding:9px 16px;font-weight:600;cursor:pointer;min-height:44px;white-space:nowrap}
.btn:hover{border-color:var(--ice)}
.btn.pri{background:var(--ice);color:#062043;border-color:var(--ice)}
.btn.ok{background:var(--green);border-color:#0b9440;color:#fff}
.btn.dan{background:transparent;border-color:var(--red);color:var(--red2)}
.btn.ghost{background:transparent}
.btn.sm{min-height:34px;padding:5px 11px;font-size:13.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ice2);outline-offset:2px}
.in{background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:9px 12px;font:inherit;width:100%;min-height:44px}
.in:focus{border-color:var(--ice);outline:none}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13.5px;color:var(--muted)}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}
.stack{display:flex;flex-direction:column;gap:14px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chip{border:1px solid var(--line);background:var(--bg2);border-radius:999px;padding:7px 16px;cursor:pointer;white-space:nowrap;font-size:14px}
.chip.on{background:var(--ice);color:#062043;border-color:var(--ice);font-weight:600}
.seg{display:inline-flex;background:var(--bg2);border:1px solid var(--line);border-radius:13px;padding:4px;gap:4px}
.seg button{display:flex;align-items:center;gap:8px;border:0;background:none;padding:9px 18px;border-radius:10px;cursor:pointer;color:var(--muted);font-weight:600}
.seg button.on{background:var(--panel2);color:var(--text);box-shadow:inset 0 -3px 0 var(--ice)}
.badge{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:999px;margin-inline-start:6px;vertical-align:middle;font-weight:600}
.badge.red{background:rgba(210,16,52,.18);color:var(--red2)}
.badge.ice{background:rgba(108,203,255,.15);color:var(--ice)}
.badge.grn{background:rgba(47,200,114,.15);color:var(--green2)}
.badge.wrn{background:rgba(245,185,66,.15);color:var(--warn)}
.tw{overflow-x:auto}
table.dt{width:100%;border-collapse:collapse;font-size:14px}
.dt th{text-align:start;color:var(--muted);font-weight:500;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.dt td{padding:9px 10px;border-bottom:1px solid rgba(37,73,122,.5)}
.dt tr.click{cursor:pointer}.dt tr.click:hover td{background:var(--bg2)}
.dt tr.low td{color:var(--red2)}
.empty{padding:28px;text-align:center;color:var(--muted)}

/* Login */
.login{grid-column:1/-1}
.lwrap{margin:auto;width:min(1000px,100%);display:grid;grid-template-columns:1fr 1.1fr;gap:32px;padding:28px 18px;align-items:center}
.lbrand{text-align:center}
img.logo{display:block;border-radius:50%;box-shadow:0 0 0 3px var(--ice),0 12px 40px rgba(0,0,0,.5);object-fit:cover}
.lbrand img.logo{width:min(250px,56vw);height:auto;aspect-ratio:1;margin:0 auto 16px}
.lbrand h1{margin:0;font-size:28px}
.side img.logo{width:60px;height:60px;margin:0 auto 10px;flex:none}
.lpanel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px}
.lpanel h2{margin-bottom:8px}
.langs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.ubtn{align-items:center;text-align:center}
.ubtn .av{width:40px;height:40px;border-radius:50%;background:var(--panel2);border:1px solid var(--ice);color:var(--ice);display:grid;place-items:center;font-weight:700;font-size:18px;margin-bottom:4px}
.pinbox{border-top:1px solid var(--line);padding-top:14px}
.pinname{text-align:center;font-weight:700;font-size:17px}
.dots{direction:ltr}
.dots i{background:none;border:2px solid var(--line)}
.dots i.f{background:var(--ice);border-color:var(--ice)}
.pad{direction:ltr}
.pad button.clr{font-size:16px;color:var(--red2)}
.in.sm{min-height:34px;padding:4px 8px;width:auto;font-size:13.5px}
.editbar{padding:8px 14px;font-size:13px;color:var(--muted);border-bottom:1px solid var(--line);flex:none}
.editbar.on{background:rgba(245,185,66,.12);color:var(--warn)}
.ln.lock .qty button:disabled,.ln.lock .ic:disabled{opacity:.3}
@media (max-width:820px){.lwrap{grid-template-columns:1fr;gap:18px}.lbrand img.logo{width:150px}}
.login{min-height:100%;display:flex;flex-direction:column}
.lbox{margin:auto;width:min(520px,100%);padding:28px 18px;text-align:center}
.lbox .emb{width:96px;height:96px}
.lbox h1{margin:10px 0 2px;font-size:28px}
.ulist{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin:18px 0}
.ubtn{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.ubtn small{color:var(--muted)}
.ubtn.on{border-color:var(--ice);background:var(--panel2)}
.dots{display:flex;justify-content:center;gap:12px;margin:8px 0 14px;min-height:16px}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--ice)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:300px;margin:0 auto}
.pad button{min-height:62px;font-size:24px;font-weight:600;border-radius:14px;border:1px solid var(--line);background:var(--panel);cursor:pointer}
.pad button.go{background:var(--ice);color:#062043;font-size:18px}
.hint{color:var(--warn);font-size:13px;margin-top:16px}

/* Tables */
.tsum{display:flex;gap:18px;flex-wrap:wrap;margin:14px 0}
.tables{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:10px}
.tbl{min-height:104px;border-radius:15px;border:1.5px dashed var(--line);background:var(--bg2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;color:var(--muted);font-size:12.5px;position:relative}
.tbl .n{font-size:27px;font-weight:700;color:var(--text);line-height:1.1}
.tbl.open{border-style:solid;border-color:var(--ice);background:linear-gradient(170deg,var(--panel2),var(--panel))}
.tbl.open .n{color:var(--ice)}
.tbl .tt{color:var(--text);font-weight:600}
.tbl.kit::after{content:"";position:absolute;inset:auto 10px 7px;height:4px;border-radius:4px;background:var(--red)}
.tbl.chg .tm{color:var(--warn)}

/* Order */
.order{display:grid;grid-template-columns:1fr 390px;gap:16px;min-height:100%}
.mwrap{display:flex;flex-direction:column;gap:12px;min-width:0}
.ohead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;align-content:start}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;min-height:88px;text-align:start;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;gap:6px}
.tile:hover{border-color:var(--ice)}
.tile:active{transform:scale(.97)}
.tile b{font-weight:600;font-size:15px}
.tile span{color:var(--ice);font-weight:700}
.cart{background:var(--panel);border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;overflow-x:hidden;overflow-y:auto;position:sticky;top:0;max-height:calc(100vh - 110px);max-height:calc(100dvh - 110px)}
.cfoot{position:sticky;bottom:0;z-index:2;background:var(--panel);border-radius:0 0 16px 16px;box-shadow:0 -8px 14px rgba(3,10,26,.35);flex:none}
.ch{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}
.ch b{font-size:18px}
.lines{flex:1 0 auto;padding:6px 10px;min-height:60px}
.cart>.ch,.cart>.custbar,.cart>.tots,.cart>.acts{flex:none}
.ln{display:grid;grid-template-columns:1fr auto auto auto;gap:8px;align-items:center;padding:9px 4px;border-bottom:1px solid rgba(37,73,122,.5)}
.ln .nm small{display:block;color:var(--warn);font-size:12px}
.ln.gone .nm{text-decoration:line-through;color:var(--muted)}
.qty{display:flex;align-items:center;gap:6px}
.qty button,.ic{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--bg2);cursor:pointer;font-size:18px;line-height:1}
.qty b{min-width:22px;text-align:center}
.lt{min-width:62px;text-align:end;font-weight:600}
.tots{padding:12px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:4px;font-size:14px}
.tots div{display:flex;justify-content:space-between}
.tots .g{font-size:22px;font-weight:700;color:var(--ice);margin-top:4px}
.acts{display:flex;flex-direction:column;gap:8px;padding:0 12px 12px}
.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:6px}
.tools .btn{min-height:40px;padding:4px 6px;font-size:13px;white-space:normal;line-height:1.25}
.acts .w{grid-column:1/-1}
.acts .btn.big{min-height:56px;font-size:18px}
.custbar{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);font-size:14px}
.custbar>span{flex:1}
.payrow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:10px;border:1px solid var(--line);border-radius:14px;background:var(--bg2)}
.payrow .btn.big{min-height:58px;font-size:18px;padding:6px}
.payrow>span{grid-column:1/-1;font-size:14px}
.payrow .btn.sm{grid-column:1/-1}
.btn.cr{background:var(--warn);color:#2a1a00;border-color:var(--warn)}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:10px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stat small{color:var(--muted);font-size:13px;display:block}
.stat .v{font-size:21px;font-weight:700}
.stat.cash{border-inline-start:4px solid var(--green2)}.stat.net{border-inline-start:4px solid var(--ice)}.stat.cr{border-inline-start:4px solid var(--warn)}.stat.bad{border-inline-start:4px solid var(--red)}
.stat.hero{background:var(--panel2);border-color:var(--ice)}.stat.hero .v{color:var(--ice);font-size:26px}
.den{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.den label{display:flex;align-items:center;gap:6px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:4px 8px;font-size:13.5px}
.den label b{min-width:34px}
.den .in{min-height:36px;padding:4px 8px}
.diff{font-size:20px;font-weight:700}
.pos{color:var(--green2)}.neg{color:var(--red2)}

/* Expenses */
.amt{font-size:30px;font-weight:700;text-align:center;min-height:64px}

/* Modal & toast */
.mb{position:fixed;inset:0;background:rgba(3,10,26,.72);display:flex;align-items:center;justify-content:center;z-index:50;padding:14px}
.md{background:var(--panel);border:1px solid var(--line);border-radius:18px;width:min(560px,100%);max-height:92vh;display:flex;flex-direction:column}
.md.wide{width:min(860px,100%)}
.mh{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.mh .x{border:0;background:none;font-size:26px;cursor:pointer;color:var(--muted);width:40px;height:40px}
.mbody{padding:16px 18px;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.mf{display:flex;gap:8px;justify-content:flex-start;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.paytot{display:flex;justify-content:space-between;align-items:center;background:var(--bg2);border-radius:12px;padding:12px 16px}
.paytot b{font-size:30px;color:var(--ice)}
.msg{font-size:14px;min-height:20px}
.warnbox{background:rgba(245,185,66,.1);border:1px solid rgba(245,185,66,.35);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:14px}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translate(-50%,30px);background:var(--panel2);border:1px solid var(--ice);padding:11px 20px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:80;max-width:90vw}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.err{border-color:var(--red)}
#print{display:none}

@media (max-width:820px){
  #app{grid-template-columns:1fr;grid-template-rows:1fr auto}
  .side{order:2;flex-direction:row;overflow-x:auto;border-inline-end:0;border-top:1px solid var(--line);padding:6px}
  .side .emb{display:none}
  .nav{min-width:72px;border-inline-start:0;border-bottom:3px solid transparent}
  .nav.on{border-bottom-color:var(--red)}
  .main{order:1;overflow:hidden}
  .order{grid-template-columns:1fr}
  .cart{position:static;max-height:none}
  .content{padding:12px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

@media print{
  @page{margin:0}
  body{background:#fff}
  #app,#modal,#toast{display:none!important}
  #print{display:block!important;color:#000;background:#fff}
}
.paper{width:72mm;padding:3mm;font-family:Tahoma,Arial,"Noto Sans Ethiopic",sans-serif;font-size:12px;color:#000;background:#fff}
.paper.p58{width:48mm;font-size:11px}
.paper .c{text-align:center}
.paper .big{font-size:16px;display:block}
.paper .huge{font-size:22px;font-weight:700;margin:3px 0}
.paper hr{border:0;border-top:1px dashed #000;margin:5px 0}
.paper .r{display:flex;justify-content:space-between}
.paper .g{font-size:15px;font-weight:700}
.paper table{width:100%;border-collapse:collapse}
.paper td{padding:2px 0;vertical-align:top}
.paper td.q{width:22%;font-weight:700}
.paper td.e{text-align:end;white-space:nowrap}
.paper.a4{width:190mm;max-width:100%;padding:0;font-size:12px;font-family:"IBM Plex Sans Arabic","IBM Plex Sans","Noto Sans Ethiopic",Tahoma,sans-serif}
.a4 .rh{display:flex;gap:14px;align-items:center;border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:8px}
.a4 .rh img{margin:0!important}
.a4 .ttl{font-size:18px;font-weight:700;margin-top:2px}
.a4 .sm{font-size:10.5px;color:#555}
.a4 .g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.a4 table{width:100%;border-collapse:collapse;margin-bottom:8px;page-break-inside:auto}
.a4 tr{page-break-inside:avoid}
.a4 td,.a4 th{border:1px solid #bbb;padding:4px 6px;text-align:start}
.a4 th{background:#eef2f7}
.a4 tr.b td{font-weight:700;background:#eef2f7}
.a4 h3{font-size:14px;margin:10px 0 4px}
.a4 .zbox{width:80mm;margin:0 auto}
.pdfbox{position:fixed;left:-10000px;top:0;background:#fff;color:#000;padding:4mm}
.paper table.k td{font-size:15px;padding:4px 0;border-bottom:1px dotted #000}
.paper .cx td{text-decoration:line-through}
.paper .nt{font-size:12px}
.paper .qr{text-align:center;margin-top:6px}
.paper .qr svg{width:34mm;height:34mm}
/* product images & statements */
.tile.has{padding:0;overflow:hidden;justify-content:flex-start;gap:4px}
.tile img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:var(--bg2)}
.tile.has b{padding:4px 10px 0;font-size:14px;line-height:1.3}
.tile.has span{padding:0 10px 8px}
img.thumb{width:34px;height:34px;border-radius:8px;object-fit:cover;vertical-align:middle;margin-inline-end:8px}
.imgrow{display:flex;gap:14px;align-items:center}
.imgbox{width:96px;height:96px;border-radius:14px;border:1px dashed var(--line);background:var(--bg2);display:grid;place-items:center;overflow:hidden;flex:none}
.imgbox img{width:100%;height:100%;object-fit:cover}
.imgbox svg.i{width:36px;height:36px;opacity:.6}
.custhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.baln{text-align:end}.baln small{display:block;color:var(--muted)}.baln b{font-size:24px}
.a4 .baln small{color:#555}.a4 .custhead{margin:6px 0 10px}
/* compact invoice panel: items, totals and payment always visible */
.cart{overflow:hidden;height:calc(100vh - 106px);height:calc(100dvh - 106px);max-height:none}
.cart .lines{flex:1 1 auto;min-height:0;overflow-y:auto;padding:2px 10px}
.cfoot{position:static;box-shadow:none;border-top:1px solid var(--line)}
.cart .ch{padding:8px 14px}.cart .ch b{font-size:16px}
.cart .custbar{padding:5px 10px}.cart .custbar .btn{min-height:32px}
.cart .editbar{padding:4px 14px;font-size:12px}.cart .editbar:not(.on){display:none}
.cart .ln{padding:5px 2px;gap:6px}
.cart .qty{gap:4px}.cart .qty button,.cart .ic{width:30px;height:30px;font-size:16px}
.cart .tots{display:grid;grid-template-columns:1fr 1fr;column-gap:14px;row-gap:0;padding:6px 14px;font-size:12.5px;border-top:0}
.cart .tots .g{grid-column:1/-1;font-size:20px;margin-top:2px}
.cart .acts{gap:6px;padding:0 10px 10px}

/* ============ Helpers ============ */
const invOf=id=>S.inv.find(x=>x.id===id);
const itemOf=id=>S.items.find(x=>x.id===id);
const ord=id=>S.orders.find(o=>o.id===id);
const custOf=id=>S.customers.find(c=>c.id===id);
const isAdmin=()=>U.user&&U.user.role==='admin';
const cur=()=>U.cur?ord(U.cur):U.draft;
const itemCost=it=>r4((it.recipe||[]).reduce((a,r)=>{const v=invOf(r.invId);return a+(v?v.cost*r.qty:0)},0));
const hasChanges=o=>o.lines.some(l=>l.qty!==l.sentQty);
function totals(o){
  const sub=o.lines.reduce((a,l)=>a+l.price*l.qty,0),disc=Math.min((o.discount||0)+(o.ptsDisc||0),sub),v=S.settings.vat/100,base=sub-disc;
  let total,vat;if(S.settings.vatIncluded){total=base;vat=base-base/(1+v)}else{vat=base*v;total=base+vat}
  return{sub:r2(sub),disc:r2(disc),vat:r2(vat),total:r2(total),net:r2(total-vat)};
}
function toast(msg,type){const t=$('#toast');t.textContent=msg;t.className='show '+(type||'');clearTimeout(toast.h);toast.h=setTimeout(()=>t.className='',2800)}
function modal(title,body,actions=[],wide){
  U.ma=actions;
  $('#modal').innerHTML=`<div class="mb" onclick="if(event.target===this)closeM()"><div class="md ${wide?'wide':''}" role="dialog" aria-modal="true"><div class="mh"><h3>${title}</h3><button class="x" onclick="closeM()" aria-label="إغلاق">×</button></div><div class="mbody" id="mbody">${body}</div><div class="mf">${actions.map((a,i)=>`<button class="btn ${a.c||''}" onclick="U.ma[${i}].f()">${a.l}</button>`).join('')}</div></div></div>`;
  const f=$('#modal [autofocus]');if(f)setTimeout(()=>{f.focus();f.select&&f.select()},40);
}
function closeM(){$('#modal').innerHTML=''}
function deduct(lines,field){let cost=0;lines.forEach(l=>{const it=itemOf(l.itemId),q=l[field];if(!it||!q)return;(it.recipe||[]).forEach(r=>{const v=invOf(r.invId);if(v){v.qty=r4(v.qty-r.qty*q);cost+=v.cost*r.qty*q}})});return r2(cost)}

  $('#app').innerHTML=`<aside class="side">${LOGO_IMG('logo')}${nav.map(n=>`<button class="nav ${U.view===n.k?'on':''}" onclick="go('${n.k}')">${ICON(n.i)}<span>${n.t}</span></button>`).join('')}</aside>

}
function go(k){if(k==='pur'&&U.view!=='pur'){U.pedit=null;U.pl=[];U.ph=null}U.view=k;if(k!=='pos'){U.cur=null;U.draft=null}render()}

const LANGS={ar:{n:'العربية',dir:'rtl'},en:{n:'English',dir:'ltr'},am:{n:'አማርኛ',dir:'ltr'}};
let LANG=(()=>{try{const l=localStorage.getItem(K+'_lang');return LANGS[l]?l:'ar'}catch(e){return 'ar'}})();
const AR=/[\u0600-\u06FF]/,NUMRE=/\d[\d.,:\/\-]*/g;
function trText(s,lang){
  if(lang==='ar'||!s||!AR.test(s))return s;
  const i=lang==='en'?0:1,lead=s.match(/^\s*/)[0],trail=s.match(/\s*$/)[0],core=s.trim();
  const one=c=>{let e=TR[c];if(e)return e[i];const nums=[],k=c.replace(NUMRE,x=>{nums.push(x);return '{n}'});e=TR[k];if(e){let j=0;return e[i].replace(/\{n\}/g,()=>nums[j++]??'')}return null};
  const full=c=>{const r=one(c);if(r!=null)return r;const parts=c.split(/(\s[·:،\-—+×]\s|:\s)/);if(parts.length>1)return parts.map((p,j)=>j%2?p:(AR.test(p)?full(p.trim()):p)).join('');
    const mm=c.match(/^(.+)\s\(([^()]+)\)$/);return mm?full(mm[1].trim())+' ('+full(mm[2].trim())+')':c};
  return lead+full(core)+trail;
}
function trNode(root,lang){
  if(!root||lang==='ar')return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),ns=[];while(w.nextNode())ns.push(w.currentNode);
  ns.forEach(n=>{const v=n.nodeValue;if(!AR.test(v))return;const p=n.parentElement;if(p&&p.closest('[translate="no"],script,style'))return;const t=trText(v,lang);if(t!==v)n.nodeValue=t});
  const at=el=>{if(el.closest('[translate="no"]'))return;['placeholder','title','aria-label'].forEach(a=>{const v=el.getAttribute(a);if(v&&AR.test(v))el.setAttribute(a,trText(v,lang))})};
  if(root.nodeType===1){at(root);root.querySelectorAll('[placeholder],[title],[aria-label]').forEach(at)}

function noDay(){return `<div class="panel" style="max-width:460px;margin:30px auto" ><h2>ابدأ اليومية لفتح البيع</h2><p class="muted">أدخل مبلغ العهدة (النقد الموجود في الدرج) عند بداية الوردية.</p><label class="f">عهدة بداية اليوم (ريال)<input class="in amt" id="opc" inputmode="decimal" value="0" autofocus onkeydown="if(event.key==='Enter')openDay()"></label><div style="margin-top:12px"><button class="btn pri" style="width:100%" onclick="openDay()">فتح اليومية</button></div></div>`}
function openDay(){S.day={id:uid(),no:S.seq.day++,openedAt:Date.now(),openedBy:U.user.name,opening:r2(num($('#opc').value))};S.seq.order=1;save();if(FB.ready){FB.root.child('seq/order').set(1);fbSeq('day',n=>{if(S.day&&S.day.no!==n){S.day.no=n;save();render()}})}toast('فُتحت اليومية، بالتوفيق');render()}

function addItem(id){const o=cur(),it=itemOf(id);ensureSaved(o);const l=o.lines.find(x=>x.itemId===id&&!x.note);if(l)l.qty++;else o.lines.push({id:uid(),itemId:id,name:it.name,price:it.price,qty:1,sentQty:0,note:''});save();renderCart()}
function lnote(lid){const o=cur(),l=o.lines.find(x=>x.id===lid);if(l.sentQty&&U.editing!==o.id)return toast('اضغط تعديل الأصناف لتغيير ما أُرسل للمطبخ','err');modal('ملاحظة للمطبخ: '+esc(l.name),`<input class="in" id="lnt" value="${esc(l.note)}" placeholder="مثال: سكر خفيف، بدون حليب" autofocus onkeydown="if(event.key==='Enter')U.ma[0].f()"><div class="chips">${['سكر خفيف','بدون سكر','سكر زيادة','حليب زيادة','بارد','مستعجل'].map(t=>`<button class="chip" onclick="$('#lnt').value=($('#lnt').value?$('#lnt').value+'، ':'')+'${t}'">${t}</button>`).join('')}</div>`,
  [{l:'حفظ الملاحظة',c:'pri',f:()=>{const v=$('#lnt').value.trim();if(v!==l.note&&l.sentQty&&l.qty){ // split: noted portion becomes a new unsent line
      o.lines.push({id:uid(),itemId:l.itemId,name:l.name,price:l.price,qty:1,sentQty:0,note:v});l.qty--;if(!l.qty&&!l.sentQty)o.lines=o.lines.filter(x=>x!==l)}else l.note=v;save();closeM();renderCart()}}])}
function renderCart(){
  const o=cur(),el=$('#cart');if(!el)return;const t=totals(o),custC=o.custId?custOf(o.custId):null,live=o.lines.filter(l=>l.qty>0),ch=hasChanges(o),ed=U.editing===o.id;
  el.innerHTML=`<div class="ch"><b>${o.type==='dine'?'طاولة '+o.table:'سفري'}${o.no?` <span class="muted num" style="font-size:14px">#${o.no}</span>`:''}</b><span class="muted" style="font-size:13px">${o.rounds?`أُرسل للمطبخ ${o.rounds} مرة`:'لم يُرسل للمطبخ'}</span></div>
  <div class="custbar">${custC?`${ICON('star')}<span><b translate="no">${esc(custC.name)}</b> <span class="muted num">${esc(custC.phone)}</span> <span class="badge wrn">${custC.points} نقطة</span></span><button class="btn sm ghost" onclick="pickCust()">تغيير</button>`:`<button class="btn sm ghost" onclick="pickCust()" style="width:100%">${ICON('star')}إضافة عميل للفاتورة (نقاط الولاء)</button>`}</div>
  ${o.rounds?`<div class="editbar ${ed?'on':''}">${ed?'وضع تعديل الأصناف: يمكنك إنقاص أو حذف ما أُرسل، ويُطبع التعديل للمطبخ عند الإرسال.':'الأصناف المرسلة للمطبخ مقفلة. اضغط تعديل الأصناف لتغييرها.'}</div>`:''}
  <div class="lines">${o.lines.length?o.lines.map(l=>{const lk=l.sentQty>0&&!ed;return `<div class="ln ${l.qty===0?'gone':''} ${lk?'lock':''}"><div class="nm"><span>${esc(lname(l))}</span>${l.sentQty&&l.qty===l.sentQty?'<span class="badge red">بالمطبخ</span>':''}${l.qty>l.sentQty&&l.sentQty?`<span class="badge ice">+${l.qty-l.sentQty} جديد</span>`:''}${l.qty<l.sentQty?`<span class="badge wrn">إلغاء ${l.sentQty-l.qty}</span>`:''}${l.note?`<small translate="no">${esc(l.note)}</small>`:''}<div class="muted num" style="font-size:12.5px">${m(l.price)}</div></div>
  <div class="qty"><button onclick="q('${l.id}',-1)" aria-label="إنقاص" ${lk&&l.qty<=l.sentQty?'disabled':''}>−</button><b class="num">${l.qty}</b><button onclick="q('${l.id}',1)" aria-label="زيادة">+</button></div><div class="lt num">${m(l.price*l.qty)}</div><button class="ic" onclick="lnote('${l.id}')" aria-label="ملاحظة" title="ملاحظة" ${lk?'disabled':''}>✎</button></div>`}).join(''):'<div class="empty">اضغط على الأصناف لإضافتها للفاتورة</div>'}</div>
  <div class="cfoot"><div class="tots"><div><span class="muted">المجموع</span><span class="num">${m(t.sub)}</span></div><div><span class="muted">ضريبة القيمة المضافة ${S.settings.vat}%${S.settings.vatIncluded?' (شاملة)':''}</span><span class="num">${m(t.vat)}</span></div><div class="g"><span>الإجمالي</span><span class="num">${m(t.total)}</span></div></div>
  <div class="acts">
    <div class="tools"><button class="btn" onclick="sendKitchen()" ${ch?'':'disabled'}>إرسال للمطبخ</button>${o.rounds?`<button class="btn ${ed?'pri':''}" onclick="toggleEdit()">${ed?'إنهاء التعديل':'تعديل الأصناف'}</button>`:''}<button class="btn" onclick="preBill()" ${live.length?'':'disabled'}>طباعة الحساب</button><button class="btn" onclick="payModal()" ${live.length?'':'disabled'}>تقسيم الدفع</button>${o.type==='dine'?`<button class="btn" onclick="moveModal()" ${o.no?'':'disabled'}>نقل الطاولة</button>`:`<button class="btn" onclick="holdTake()" ${o.no?'':'disabled'}>تعليق الطلب</button>`}</div>
    <div class="payrow"><button class="btn ok big" onclick="payModal('cash')" ${live.length?'':'disabled'}>كاش</button><button class="btn pri big" onclick="payModal('net')" ${live.length?'':'disabled'}>شبكة</button><button class="btn cr big" onclick="payModal('cr')" ${live.length?'':'disabled'}>آجل</button><button class="btn dan big" onclick="voidModal()" ${o.lines.length||o.no?'':'disabled'}>إلغاء</button></div>
  </div></div>`;
}
function toggleEdit(){const o=cur();U.editing=U.editing===o.id?null:o.id;renderCart()}
function q(lid,d){const o=cur(),l=o.lines.find(x=>x.id===lid);if(!l)return;
  if(d<0&&l.sentQty&&l.qty<=l.sentQty&&U.editing!==o.id)return toast('اضغط تعديل الأصناف لتغيير ما أُرسل للمطبخ','err');
  l.qty=Math.max(0,l.qty+d);if(l.qty===0&&!l.sentQty)o.lines=o.lines.filter(x=>x!==l);save();renderCart()}
function kitchenChanges(o){return o.lines.filter(l=>l.qty!==l.sentQty).map(l=>({name:lname(l,S.settings.kitLang),note:l.note,d:l.qty-l.sentQty}))}
function sendKitchen(silent){
  const o=cur();const ch=kitchenChanges(o);if(!ch.length){if(!silent)toast('لا توجد أصناف جديدة للإرسال');return}
  if(S.settings.autoKitchen)printHTML(kitTicket(o,ch),{lang:S.settings.kitLang});
  o.lines.forEach(l=>l.sentQty=l.qty);o.lines=o.lines.filter(l=>l.qty>0);o.rounds++;o.sentAt=Date.now();U.editing=null;save();
  if(silent)return;toast('أُرسل الطلب للمطبخ');
  if(o.type==='dine'){U.cur=null;U.draft=null;vPOS()}else renderCart();
}
function holdTake(){U.cur=null;U.draft=null;toast('عُلّق الطلب، تجده في الطلبات المعلقة');vPOS()}
function preBill(){printHTML(receipt(cur(),true))}
function moveModal(){const o=cur(),busy=S.orders.filter(x=>x.status==='open'&&x.type==='dine').map(x=>x.table);let h='<div class="tables" style="grid-template-columns:repeat(auto-fill,minmax(64px,1fr))">';
  for(let i=1;i<=S.settings.tables;i++)if(!busy.includes(i))h+=`<button class="tbl" style="min-height:60px" onclick="moveTo(${i})"><span class="n" style="font-size:20px">${i}</span></button>`;
  modal(`نقل طاولة ${o.table} إلى`,h+'</div>',[],true)}
function moveTo(i){const o=cur(),f=o.table;o.table=i;save();closeM();if(o.rounds&&S.settings.autoKitchen)printHTML(`<div class="c"><b class="big">المطبخ</b><div class="huge">نقل طاولة</div><div class="huge">${f} ← ${i}</div><div>${fdt(Date.now())}</div></div>`,{lang:S.settings.kitLang});toast(`نُقلت إلى طاولة ${i}`);renderCart();vPOS()}

/* Payment */
function payModal(method){
  if(method==='cr')return creditModal();
  const o=cur(),t=totals(o);U.payDisc=o.discount||0;const pc=o.custId?custOf(o.custId):null;
  const custs=[...new Set(S.orders.filter(x=>x.customer).map(x=>x.customer))];
  modal(method?'الدفع '+PAY[method]+' وإقفال الفاتورة':'تقسيم الدفع وإقفال الفاتورة',`<div class="paytot"><span>المطلوب</span><b class="num" id="ptot">${m(t.total)}</b></div>
  <div class="bar"><button class="btn" style="flex:1" onclick="payAll('cash')">كله كاش</button><button class="btn" style="flex:1" onclick="payAll('net')">كله شبكة</button><button class="btn" style="flex:1" onclick="payAll('cr')">كله آجل</button></div>
  <div class="row2"><label class="f">كاش<input class="in num" id="pc" inputmode="decimal" value="${t.total}" oninput="payCalc()" autofocus></label><label class="f">شبكة (مدى/فيزا)<input class="in num" id="pn" inputmode="decimal" value="0" oninput="payCalc()"></label><label class="f">آجل<input class="in num" id="pa" inputmode="decimal" value="0" oninput="payCalc()"></label></div>
  <div class="warnbox" id="crbox" hidden>${pc?`الآجل على العميل <bdi translate="no">${esc(pc.name)} ${esc(pc.phone)}</bdi>`:'للبيع الآجل أضف العميل للفاتورة أولاً من زر آجل'}</div>
  ${pc?`<div class="warnbox" style="color:var(--text)">العميل <bdi translate="no">${esc(pc.name)}</bdi>: رصيده <b>${pc.points}</b> نقطة (تساوي ${m(pc.points*S.settings.ptValue)} ريال)${S.settings.loyaltyOn&&pc.points>=S.settings.minRedeem?`<label class="f" style="margin-top:8px">نقاط للاستبدال كخصم<div class="bar"><input class="in num" id="ppts" inputmode="numeric" value="0" oninput="payCalc(true)" style="flex:1"><button class="btn sm" onclick="$('#ppts').value=${pc.points};payCalc(true)">كل الرصيد</button></div></label>`:`<div class="muted" style="font-size:13px">الاستبدال متاح من ${S.settings.minRedeem} نقطة</div>`}</div>`:''}
  <div class="row2"><label class="f">خصم بالريال<input class="in num" id="pd" inputmode="decimal" value="${o.discount||0}" oninput="payCalc(true)"></label><label class="f">المبلغ المستلم نقداً<input class="in num" id="pr" inputmode="decimal" placeholder="لحساب الباقي" oninput="payCalc()"></label></div>
  <div class="paytot" style="background:none;border:1px solid var(--line)"><span>الباقي للعميل</span><b class="num" id="pchg" style="font-size:22px;color:var(--green2)">0.00</b></div>
  <div class="msg" id="pmsg"></div>`,
  [{l:'تأكيد الدفع وإقفال الفاتورة',c:'ok',f:confirmPay},{l:'إلغاء الفاتورة',c:'dan',f:()=>{closeM();voidModal()}},{l:'رجوع',c:'ghost',f:closeM}]);
  if(method){payAll(method);setTimeout(()=>{const f=method==='cr'?$('#pcust'):method==='cash'?$('#pr'):null;if(f)f.focus()},60)}else payCalc();
}
function payPts(){const o=cur(),c=o.custId&&custOf(o.custId),e=$('#ppts');if(!c||!e)return 0;const sub=o.lines.reduce((a,l)=>a+l.price*l.qty,0)-Math.max(0,num($('#pd').value));return Math.max(0,Math.min(Math.floor(num(e.value)),c.points,S.settings.ptValue>0?Math.ceil(Math.max(0,sub)/S.settings.ptValue):0))}
function payTotal(){const o=cur(),d=num($('#pd').value);const keep=[o.discount,o.ptsDisc];o.discount=Math.max(0,d);o.ptsDisc=r2(payPts()*S.settings.ptValue);const t=totals(o);o.discount=keep[0];o.ptsDisc=keep[1];return t}
function payAll(k){const t=payTotal();['pc','pn','pa'].forEach(id=>$('#'+id).value=0);$({cash:'#pc',net:'#pn',cr:'#pa'}[k]).value=t.total;payCalc()}
function payCalc(discChanged){
  const t=payTotal();$('#ptot').textContent=m(t.total);
  if(discChanged){$('#pc').value=t.total;$('#pn').value=0;$('#pa').value=0}
  const c=num($('#pc').value),n=num($('#pn').value),a=num($('#pa').value),rem=r2(t.total-c-n-a);
  $('#crbox').hidden=!(a>0);const rec=num($('#pr').value);$('#pchg').textContent=m(rec>c?rec-c:0);
  $('#pmsg').innerHTML=Math.abs(rem)<.01?'<span class="pos">المبالغ مطابقة للإجمالي</span>':rem>0?`<span class="neg">متبقٍ ${m(rem)} لم يُوزّع</span>`:`<span class="neg">المبالغ تزيد عن الإجمالي بـ ${m(-rem)}</span>`;
}
/* ============ Credit sales & customer statements ============ */
const isSale=o=>o.status==='paid'||o.status==='credit';
function custBal(c){const deb=S.orders.filter(o=>o.custId===c.id&&isSale(o)).reduce((a,o)=>a+(o.pay.cr||0),0),cr=S.collections.filter(x=>x.custId===c.id).reduce((a,x)=>a+x.amount,0);return r2(deb-cr)}
function finalizeSale(o,pay,disc,used){
  ensureSaved(o);o.discount=r2(Math.max(0,disc||0));o.ptsUsed=used||0;o.ptsDisc=r2(o.ptsUsed*S.settings.ptValue);
  if(hasChanges(o))sendKitchen(true);
  o.lines=o.lines.filter(l=>l.qty>0);
  const lc=o.custId&&custOf(o.custId);

function daySum(dayId,opening){

  os.forEach(o=>{if(isSale(o)){s.count++;s.cash+=o.pay.cash;s.net+=o.pay.net;s.cr+=o.pay.cr;s.disc+=o.tot.disc;s.vat+=o.tot.vat;s.total+=o.tot.total;s.cogs+=o.cogs;s[o.type]+=o.tot.total}else if(o.status==='void'){s.voids++;s.voidVal+=o.tot?o.tot.total:0;s.waste+=o.waste||0}else s.open++});

  S.purchases.filter(p=>p.dayId===dayId).forEach(p=>p.pay==='cash'?s.purCash+=p.total:p.pay==='net'?s.purNet+=p.total:s.purCr+=p.total);
  S.collections.filter(c=>c.dayId===dayId).forEach(c=>c.pay==='cash'?s.colCash+=c.amount:s.colNet+=c.amount);

}

  <label class="f">طريقة الدفع<select class="in" id="ppay" onchange="U.ph.pay=this.value">${[['cash','كاش من الدرج'],['net','شبكة / تحويل'],['cr','آجل للمورد']].map(([k,t])=>`<option value="${k}" ${U.ph.pay===k?'selected':''}>${t}</option>`).join('')}</select></label></div>
  <div class="tw"><table class="dt"><thead><tr><th>الصنف (مادة خام)</th><th>الكمية</th><th>سعر الوحدة</th><th>الإجمالي</th><th></th></tr></thead><tbody>
  ${U.pl.map((l,i)=>`<tr><td><select class="in" onchange="U.pl[${i}].invId=this.value;vPur()">${S.inv.map(v=>`<option value="${v.id}" ${v.id===l.invId?'selected':''}>${esc(v.name)} (${esc(v.unit)})</option>`).join('')}</select>${info(l,i)}</td><td><input class="in num" inputmode="decimal" value="${l.qty}" oninput="U.pl[${i}].qty=this.value;plTot()"></td><td><input class="in num" inputmode="decimal" value="${l.price}" oninput="U.pl[${i}].price=this.value;plTot()"></td><td class="n" id="plt${i}">${m(num(l.qty)*num(l.price))}</td><td><button class="ic" onclick="U.pl.splice(${i},1);vPur()" aria-label="حذف السطر">×</button></td></tr>`).join('')}</tbody></table></div>

function plTot(){let t=0;const tab=U.ptab||'daily',sum={};U.pl.forEach((l,i)=>{const v=num(l.qty)*num(l.price);t+=v;const e=$('#plt'+i);if(e)e.textContent=m(v);sum[l.invId]=(sum[l.invId]||0)+num(l.qty)});$('#pltot').textContent=m(t);
  const over=tab==='daily'?Object.entries(sum).filter(([id,qq])=>{const v=invOf(id);return v&&v.dailyLimit>0&&qq+dayQty(id,U.pedit)>v.dailyLimit+1e-9}).map(([id])=>invOf(id).name):[];
  const mg=$('#plmsg');if(mg)mg.innerHTML=over.length?`<span class="neg">تجاوز الحد اليومي:</span> <span class="neg" translate="no">${over.map(esc).join('، ')}</span>`:''}
function startPurEdit(id){const p=S.purchases.find(x=>x.id===id);if(!p||!canEditPur(p))return;U.ptab=p.kind||'long';U.pedit=id;U.pl=p.lines.map(l=>({invId:l.invId,qty:String(l.qty),price:String(l.price)}));U.ph={sup:p.supplier||'',ref:p.ref||'',pay:p.pay};vPur();$('#content').scrollTop=0}

function revPur(p){p.lines.forEach(l=>{const v=invOf(l.invId);if(!v)return;const nq=r4(v.qty-l.qty);if(nq>0){const c=(v.qty*v.cost-l.qty*l.price)/nq;if(c>0)v.cost=r4(c)}v.qty=nq})}
function savePur(force){
  const tab=U.ptab||'daily',lines=U.pl.filter(l=>l.invId&&num(l.qty)>0);if(!lines.length)return toast('أضف سطراً واحداً على الأقل بكمية صحيحة','err');

  if(pay==='cash'&&!S.day&&!old)return toast('افتح اليومية لتسجيل مشتريات نقدية من الدرج','err');
  if(tab==='daily'&&!force){const sum={};lines.forEach(l=>sum[l.invId]=(sum[l.invId]||0)+num(l.qty));
    const over=Object.entries(sum).map(([id,qq])=>{const v=invOf(id),tot=r4(qq+dayQty(id,U.pedit));return v&&v.dailyLimit>0&&tot>v.dailyLimit+1e-9?`${v.name}: ${tot} / ${v.dailyLimit} ${v.unit}`:null}).filter(Boolean);
    if(over.length){const lst=`<ul translate="no">${over.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
      if(!isAdmin())return modal('تجاوز الحد اليومي',`<div class="warnbox">هذه الكميات تتجاوز الحد اليومي المسموح، ولا تُحفظ إلا بموافقة المدير.</div>${lst}<label class="f">رمز المدير<input class="in" id="olp" type="password" inputmode="numeric" autofocus></label>`,
        [{l:'موافقة المدير والحفظ',c:'pri',f:()=>{if(!S.users.some(u=>u.role==='admin'&&u.active&&u.pin===$('#olp').value))return toast('رمز المدير غير صحيح','err');closeM();savePur(true)}},{l:'رجوع',c:'ghost',f:closeM}]);
      return modal('تجاوز الحد اليومي',`<div class="warnbox">هذه الكميات تتجاوز الحد اليومي المسموح.</div>${lst}`,[{l:'حفظ رغم التجاوز',c:'dan',f:()=>{closeM();savePur(true)}},{l:'رجوع',c:'ghost',f:closeM}])}}
  if(old)revPur(old);
  const L=lines.map(l=>{const v=invOf(l.invId),qq=num(l.qty),pr=num(l.price),nq=v.qty+qq;v.cost=r4(v.qty>0&&nq>0?(v.qty*v.cost+qq*pr)/nq:pr);v.qty=r4(nq);return{invId:v.id,name:v.name,unit:v.unit,qty:qq,price:pr}}),total=r2(L.reduce((a,l)=>a+l.qty*l.price,0));
  if(old){Object.assign(old,{supplier:U.ph.sup.trim(),ref:U.ph.ref.trim(),pay,lines:L,total,editedAt:Date.now(),editedBy:U.user.name});toast('عُدّلت الفاتورة وتحدّث المخزون')}
  else{const pp={id:uid(),no:S.seq.purchase++,kind:tab,date:Date.now(),supplier:U.ph.sup.trim(),ref:U.ph.ref.trim(),pay,lines:L,total,user:U.user.name,dayId:S.day?.id||null};S.purchases.push(pp);fbSeq('purchase',n=>{if(pp.no!==n){pp.no=n;save()}});toast('حُفظت الفاتورة وتحدّث المخزون ومتوسط التكلفة')}
  U.pl=[];U.pedit=null;U.ph=null;save();vPur();
}

  <div class="panel"><h2>سجل الجرد والتسويات</h2><div class="tw"><table class="dt"><thead><tr><th>التاريخ</th><th>المادة</th><th>قبل</th><th>بعد</th><th>فرق القيمة</th><th>السبب</th><th>بواسطة</th></tr></thead><tbody>

function countModal(id){const v=invOf(id);modal('جرد: '+esc(v.name),`<p>الكمية في النظام: <b class="num">${+v.qty.toFixed(3)} ${esc(v.unit)}</b></p><label class="f">الكمية الفعلية بعد العدّ<input class="in amt num" id="ca" inputmode="decimal" autofocus></label><label class="f">السبب<select class="in" id="cr">${['جرد دوري','تالف','هدر','تصحيح إدخال'].map(x=>`<option value="${x}">${x}</option>`).join('')}</select></label>`,

  ${S.items.map(i=>{const cs=itemCost(i),net=S.settings.vatIncluded?i.price/(1+S.settings.vat/100):i.price,mg=net?((net-cs)/net*100):0;return `<tr><td>${i.img?`<img class="thumb" src="${i.img}" alt="">`:''}${esc(i.name)}${i.nameEn||i.nameAm?` <small class="muted" translate="no">${esc([i.nameEn,i.nameAm].filter(Boolean).join(' · '))}</small>`:''}${i.recipe.length?'':' <span class="badge wrn">بلا وصفة</span>'}</td><td>${esc(S.cats.find(c=>c.id===i.catId)?.name||'—')}</td><td class="n">${m(i.price)}</td><td class="n">${cs.toFixed(3)}</td><td class="n ${mg<50?'neg':'pos'}">${mg.toFixed(1)}%</td><td>${i.active?'<span class="badge grn">متاح</span>':'<span class="badge red">موقوف</span>'}</td><td><button class="btn sm" onclick="itemModal('${i.id}')">تعديل</button></td></tr>`}).join('')}</tbody></table></div><p class="muted" style="font-size:13px">الهامش محسوب على السعر بعد خصم الضريبة. التكلفة تُحسب تلقائياً من وصفة الصنف ومتوسط تكلفة المواد الخام.</p></div></div>`;
}
function catModal(id){const c=id?S.cats.find(x=>x.id===id):null,used=c&&S.items.some(i=>i.catId===c.id);
  modal(c?'تعديل قسم':'قسم جديد',`<label class="f">اسم القسم (عربي)<input class="in" id="cn" value="${esc(c?.name)}" autofocus></label><div class="row2"><label class="f">بالإنجليزية<input class="in" id="cne" dir="ltr" value="${esc(c?.nameEn||'')}"></label><label class="f">بالأمهرية<input class="in" id="cna" dir="ltr" value="${esc(c?.nameAm||'')}"></label></div>`,[{l:'حفظ',c:'pri',f:()=>{const n=$('#cn').value.trim();if(!n)return;const d={name:n,nameEn:$('#cne').value.trim(),nameAm:$('#cna').value.trim()};if(c)Object.assign(c,d);else S.cats.push({id:uid(),...d});save();closeM();vItems()}},...(c&&!used?[{l:'حذف القسم',c:'dan',f:()=>{S.cats=S.cats.filter(x=>x!==c);save();closeM();vItems()}}]:[]),{l:'رجوع',c:'ghost',f:closeM}])}
function itemModal(id){const it=id?itemOf(id):null;U.it={img:it?.img||'',nameEn:it?.nameEn||'',nameAm:it?.nameAm||'',name:it?.name||'',catId:it?.catId||S.cats[0]?.id||'',price:it?.price??'',active:it?it.active:true};U.rc=(it?.recipe||[]).map(r=>({...r}));U.itId=id||null;drawItem()}
function drawItem(){
  const cost=r4(U.rc.reduce((a,r)=>{const v=invOf(r.invId);return a+(v?v.cost*num(r.qty):0)},0));

  <div class="row2"><label class="f">القسم<select class="in" onchange="U.it.catId=this.value">${S.cats.map(c=>`<option value="${c.id}" ${c.id===U.it.catId?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label><label class="f">سعر البيع${S.settings.vatIncluded?' (شامل الضريبة)':''}<input class="in num" inputmode="decimal" value="${U.it.price}" oninput="U.it.price=this.value"></label><label class="f">الحالة<select class="in" onchange="U.it.active=this.value==='1'"><option value="1" ${U.it.active?'selected':''}>متاح للبيع</option><option value="0" ${U.it.active?'':'selected'}>موقوف</option></select></label></div>
  <div class="imgrow"><div class="imgbox">${U.it.img?`<img src="${U.it.img}" alt="">`:ICON('cup')}</div><div class="stack" style="gap:6px"><b>صورة المنتج</b><div class="bar"><label class="btn sm">${U.it.img?'تغيير الصورة':'إضافة صورة'}<input type="file" accept="image/*" hidden onchange="pickImg(this)"></label>${U.it.img?'<button class="btn sm dan" onclick="rmImg()">حذف الصورة</button>':''}</div><small class="muted">صورة مربعة تظهر في لوحة البيع</small></div></div>
  <h3>وصفة الصنف (المكونات لكل وحدة مباعة)</h3>
  ${U.rc.map((r,i)=>`<div class="bar"><select class="in" style="flex:2" onchange="U.rc[${i}].invId=this.value;drawItem()">${S.inv.map(v=>`<option value="${v.id}" ${v.id===r.invId?'selected':''}>${esc(v.name)}</option>`).join('')}</select><input class="in num" style="flex:1" inputmode="decimal" value="${r.qty}" onchange="U.rc[${i}].qty=num(this.value);drawItem()" placeholder="الكمية"><span class="muted" style="min-width:44px">${esc(invOf(r.invId)?.unit||'')}</span><button class="ic" onclick="U.rc.splice(${i},1);drawItem()" aria-label="حذف">×</button></div>`).join('')||'<p class="muted">بدون وصفة لن تُحسب تكلفة هذا الصنف ولن يُخصم من المخزون.</p>'}
  <div class="bar" style="justify-content:space-between"><button class="btn sm" onclick="U.rc.push({invId:S.inv[0]?.id,qty:0});drawItem()" ${S.inv.length?'':'disabled'}>+ مكوّن</button><b>تكلفة الوحدة: <span class="num">${cost.toFixed(3)}</span></b></div>`,
  [{l:'حفظ الصنف',c:'pri',f:()=>{const n=U.it.name.trim(),p=num(U.it.price);if(!n||p<=0)return toast('اكتب الاسم وسعر بيع صحيح','err');const data={img:U.it.img||'',name:n,nameEn:U.it.nameEn.trim(),nameAm:U.it.nameAm.trim(),catId:U.it.catId,price:p,active:U.it.active,recipe:U.rc.filter(r=>r.invId&&num(r.qty)>0).map(r=>({invId:r.invId,qty:num(r.qty)}))};
    if(U.itId)Object.assign(itemOf(U.itId),data);else S.items.push({id:uid(),...data});save();closeM();vItems()}},{l:'رجوع',c:'ghost',f:closeM}],true);
}

/* ============ Waste & fixed assets ============ */
const WR=['تالف','منتهي الصلاحية','انسكاب','خطأ في التحضير','مرتجع من العميل','أخرى'];
const ASC=['معدات وآلات','أثاث','أجهزة إلكترونية','ديكور وتجهيزات','سيارات','أخرى'];
const inMonth=(t,mo)=>fd(t).slice(0,7)===mo;
const segTabs=(cur,list,fn)=>`<div class="seg">${list.map(([k,t])=>`<button class="${cur===k?'on':''}" onclick="${fn}('${k}')">${t}</button>`).join('')}</div>`;
function wTab(k){U.wtab=k;vWaste()}
function vWaste(){
  const tab=isAdmin()?(U.wtab||'waste'):'waste',c=$('#content'),head=isAdmin()?segTabs(tab,[['waste','الهدر والتالف'],['assets','الأصول والإهلاك']],'wTab'):'';
  if(tab==='assets'){c.innerHTML=`<div class="stack">${head}${assetsHTML()}</div>`;return}
  const kind=U.wk||'inv',mo=today().slice(0,7),td=today();
  const wT=S.waste.filter(w=>fd(w.date)===td).reduce((a,w)=>a+w.cost,0),wM=S.waste.filter(w=>inMonth(w.date,mo)).reduce((a,w)=>a+w.cost,0),vM=S.orders.filter(o=>o.status==='void'&&o.voidAt&&inMonth(o.voidAt,mo)).reduce((a,o)=>a+(o.waste||0),0);
  const opts=kind==='inv'?S.inv.map(v=>`<option value="${v.id}">${esc(v.name)} (${esc(v.unit)})</option>`).join(''):S.items.map(i=>`<option value="${i.id}">${esc(iname(i))}</option>`).join('');
  c.innerHTML=`<div class="stack">${head}<div class="stats">${stat('هدر اليوم',m(wT),'bad')}${stat('هدر هذا الشهر',m(wM),'bad')}${stat('هدر الفواتير الملغاة هذا الشهر',m(vM),'bad')}${stat('إجمالي الهدر هذا الشهر',m(wM+vM),'hero','بسعر التكلفة')}</div>
  <div class="panel stack" style="max-width:820px"><h2>تسجيل هدر أو تالف</h2>
  ${segTabs(kind,[['inv','مادة خام'],['item','صنف جاهز']],'wKind')}
  <div class="row2"><label class="f">${kind==='inv'?'المادة':'الصنف'}<select class="in" id="wi">${opts}</select></label><label class="f">الكمية<input class="in num" id="wq" inputmode="decimal" placeholder="0"></label></div>
  <div class="chips" style="flex-wrap:wrap">${WR.map(r=>`<button class="chip ${(U.wr||WR[0])===r?'on':''}" onclick="U.wr='${r}';this.parentNode.querySelectorAll('.chip').forEach(b=>b.classList.toggle('on',b===this))">${r}</button>`).join('')}</div>
  <input class="in" id="wn" placeholder="ملاحظة (اختياري)">
  <button class="btn pri" onclick="saveWaste()">تسجيل الهدر وخصمه من المخزون</button></div>
  <div class="panel"><h2>سجل الهدر</h2><div class="tw"><table class="dt"><thead><tr><th>التاريخ</th><th>النوع</th><th>الاسم</th><th>الكمية</th><th>التكلفة</th><th>السبب</th><th>بواسطة</th><th></th></tr></thead><tbody>
  ${S.waste.slice().reverse().slice(0,80).map(w=>`<tr><td class="n">${fdt(w.date)}</td><td>${w.kind==='inv'?'مادة خام':'صنف جاهز'}</td><td>${esc(w.kind==='item'?iname(itemOf(w.refId))||w.name:w.name)}</td><td class="n">${w.qty} ${esc(w.unit||'')}</td><td class="n">${m(w.cost)}</td><td>${esc(w.reason)}${w.note?` <small class="muted" translate="no">${esc(w.note)}</small>`:''}</td><td translate="no">${esc(w.user)}</td><td>${isAdmin()?`<button class="btn sm dan" onclick="delWaste('${w.id}')">حذف</button>`:''}</td></tr>`).join('')||'<tr><td colspan="8" class="empty">لا يوجد هدر مسجّل</td></tr>'}</tbody></table></div></div></div>`;
}
function wKind(k){U.wk=k;vWaste()}
function saveWaste(){const kind=U.wk||'inv',id=$('#wi').value,qq=num($('#wq').value);if(!id||qq<=0)return toast('اختر الصنف وأدخل كمية صحيحة','err');
  let name,unit='',cost;if(kind==='inv'){const v=invOf(id);name=v.name;unit=v.unit;cost=r2(v.cost*qq);v.qty=r4(v.qty-qq)}else{const it=itemOf(id);name=it.name;cost=deduct([{itemId:id,qty:qq}],'qty')}
  S.waste.push({id:uid(),date:Date.now(),kind,refId:id,name,unit,qty:qq,cost,reason:U.wr||WR[0],note:$('#wn').value.trim(),user:U.user.name,dayId:S.day?.id||null});save();toast('سُجّل الهدر بتكلفة '+m(cost));vWaste()}
function delWaste(id){const w=S.waste.find(x=>x.id===id);modal('حذف سجل الهدر','<p>سيُحذف السجل وتُعاد الكمية للمخزون.</p>',[{l:'حذف',c:'dan',f:()=>{
  if(w.kind==='inv'){const v=invOf(w.refId);if(v)v.qty=r4(v.qty+w.qty)}else{const it=itemOf(w.refId);if(it)it.recipe.forEach(r=>{const v=invOf(r.invId);if(v)v.qty=r4(v.qty+r.qty*w.qty)})}
  S.waste=S.waste.filter(x=>x!==w);save();closeM();vWaste()}},{l:'رجوع',c:'ghost',f:closeM}])}
const MONTHMS=30.4375*864e5;
function depRange(a,from,to){const per=(a.cost-(a.salvage||0))/Math.max(1,a.life)/30.4375,s=new Date(a.date+'T00:00:00').getTime();let e=s+a.life*MONTHMS;if(a.disposed)e=Math.min(e,new Date(a.disposed+'T00:00:00').getTime());
  const f=new Date(from+'T00:00:00').getTime(),t=new Date(to+'T00:00:00').getTime()+864e5;return Math.max(0,per*(Math.min(e,t)-Math.max(s,f))/864e5)}
function depNow(a){const acc=r2(depRange(a,a.date,today()));return{mon:r2((a.cost-(a.salvage||0))/Math.max(1,a.life)),acc,book:r2(a.cost-acc)}}
function assetsHTML(){const L=S.assets;let c=0,acc=0,mon=0;L.forEach(a=>{const d=depNow(a);c+=a.cost;acc+=d.acc;if(!a.disposed&&d.book>(a.salvage||0)+.01)mon+=d.mon});
  return `<div class="stats">${stat('تكلفة الأصول',m(c))}${stat('مجمع الإهلاك',m(acc),'bad')}${stat('القيمة الدفترية',m(c-acc),'hero')}${stat('الإهلاك الشهري الحالي',m(mon),'cr')}</div>
  <div class="panel"><div class="bar" style="justify-content:space-between;margin-bottom:8px"><h2 style="margin:0">سجل الأصول الثابتة</h2><button class="btn pri" onclick="assetModal()">+ أصل جديد</button></div>
  <div class="tw"><table class="dt"><thead><tr><th>الأصل</th><th>الفئة</th><th>تاريخ الشراء</th><th>التكلفة</th><th>العمر (شهر)</th><th>الإهلاك الشهري</th><th>مجمع الإهلاك</th><th>القيمة الدفترية</th><th>الحالة</th><th></th></tr></thead><tbody>
  ${L.map(a=>{const d=depNow(a);return `<tr><td translate="no">${esc(a.name)}</td><td>${esc(a.cat)}</td><td class="n">${a.date}</td><td class="n">${m(a.cost)}</td><td class="n">${a.life}</td><td class="n">${m(d.mon)}</td><td class="n">${m(d.acc)}</td><td class="n">${m(d.book)}</td><td>${a.disposed?'<span class="badge red">مُستبعد</span>':d.book<=(a.salvage||0)+.01?'<span class="badge wrn">مُهلك بالكامل</span>':'<span class="badge grn">قيد الاستخدام</span>'}</td><td><button class="btn sm" onclick="assetModal('${a.id}')">تعديل</button></td></tr>`}).join('')||'<tr><td colspan="10" class="empty">أضف أصول المقهى مثل مكينة القهوة والثلاجات والأثاث</td></tr>'}</tbody></table></div>
  <p class="muted" style="font-size:13px">الإهلاك بطريقة القسط الثابت: التكلفة ناقص قيمة الخردة مقسومة على العمر الإنتاجي بالأشهر، ويُحتسب تلقائياً في تقرير الأرباح حسب الفترة.</p></div>`}
function assetModal(id){const a=id?S.assets.find(x=>x.id===id):null;
  modal(a?'تعديل أصل':'أصل جديد',`<label class="f">اسم الأصل<input class="in" id="an" value="${esc(a?.name||'')}" autofocus placeholder="مثال: مكينة إسبريسو"></label>
  <div class="row2"><label class="f">الفئة<select class="in" id="ac">${ASC.map(c=>`<option value="${c}" ${a?.cat===c?'selected':''}>${c}</option>`).join('')}</select></label><label class="f">تاريخ الشراء<input class="in" type="date" id="ad" value="${a?.date||today()}"></label></div>
  <div class="row2"><label class="f">تكلفة الشراء<input class="in num" id="ak" inputmode="decimal" value="${a?.cost??''}"></label><label class="f">العمر الإنتاجي (بالأشهر)<input class="in num" id="al" inputmode="numeric" value="${a?.life??60}"></label><label class="f">قيمة الخردة المتوقعة<input class="in num" id="as" inputmode="decimal" value="${a?.salvage??0}"></label></div>
  ${a?`<label class="f">تاريخ الاستبعاد أو البيع (اتركه فارغاً إذا كان مستخدماً)<input class="in" type="date" id="ax" value="${a.disposed||''}"></label>`:''}`,
  [{l:'حفظ',c:'pri',f:()=>{const n=$('#an').value.trim(),k=num($('#ak').value),l=Math.round(num($('#al').value));if(!n||k<=0||l<1)return toast('اكتب الاسم والتكلفة والعمر الإنتاجي','err');
    const d={name:n,cat:$('#ac').value,date:$('#ad').value||today(),cost:r2(k),life:l,salvage:r2(Math.min(k,num($('#as').value))),disposed:a?($('#ax').value||''):''};if(a)Object.assign(a,d);else S.assets.push({id:uid(),...d});save();closeM();vWaste()}},
   ...(a?[{l:'حذف',c:'dan',f:()=>{S.assets=S.assets.filter(x=>x!==a);save();closeM();vWaste()}}]:[]),{l:'رجوع',c:'ghost',f:closeM}],true)}
/* ============ Payroll & fixed monthly bills ============ */
const curMonth=()=>today().slice(0,7);
function hTab(k){U.htab=k;vHR()}
function vHR(){const tab=U.htab||'pay',mo=U.pm||curMonth();

function repData(from,to){

  paid.forEach(o=>{s.total+=o.tot.total;s.vat+=o.tot.vat;s.cogs+=o.cogs;s.disc+=o.tot.disc;s.cash+=o.pay.cash;s.net+=o.pay.net;s.cr+=o.pay.cr;s[o.type]+=o.tot.total});
  const wasteW=S.waste.filter(w=>inR(w.date)).reduce((a,w)=>a+w.cost,0),wasteV=S.orders.filter(o=>o.status==='void'&&o.voidAt&&inR(o.voidAt)).reduce((a,o)=>a+(o.waste||0),0),adj=S.adjust.filter(a=>inR(a.date)).reduce((x,a)=>x+a.value,0);
  const dep=S.assets.reduce((a,x)=>a+depRange(x,from,to),0),expT=exps.reduce((a,e)=>a+e.amount,0),payT=exps.filter(e=>e.cat==='رواتب وأجور').reduce((a,e)=>a+e.amount,0);
  const pur={daily:0,long:0};S.purchases.filter(p=>inR(p.date)).forEach(p=>pur[p.kind==='daily'?'daily':'long']+=p.total);
  const netSales=s.total-s.vat,gross=netSales-s.cogs,np=gross-expT-wasteW-wasteV+adj-dep,vf=1+(S.settings.vatIncluded?S.settings.vat/100:0);
  const im={};paid.forEach(o=>{const share=o.tot.sub?o.tot.total/o.tot.sub:1;o.lines.forEach(l=>{const k=l.itemId||l.name;if(!im[k])im[k]={name:lname(l),q:0,rev:0,cost:0};im[k].q+=l.qty;im[k].rev+=l.price*l.qty*share;const it=itemOf(l.itemId);im[k].cost+=it?itemCost(it)*l.qty:0})});

}

function openMail(subject,body){const to=S.settings.emails;const url=`mailto:${to.join(',')}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;let w=null;try{w=window.open(url,'_blank')}catch(e){}if(!w)location.href=url}
async function reportPDF(html,fname,subject){
  subject=T(subject);toast('جارٍ تجهيز ملف PDF');
  try{
    if(!window.html2pdf)await loadJS('https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js');
    const box=document.createElement('div');box.className='paper a4 pdfbox';box.dir=LANGS[LANG].dir;box.innerHTML=html;trNode(box,LANG);document.body.appendChild(box);
    const blob=await html2pdf().set({margin:10,filename:fname,image:{type:'jpeg',quality:.95},html2canvas:{scale:2,backgroundColor:'#ffffff',useCORS:true},jsPDF:{unit:'mm',format:'a4',orientation:'portrait'},pagebreak:{mode:['css','legacy']}}).from(box).outputPdf('blob');box.remove();
    const file=new File([blob],fname,{type:'application/pdf'}),to=S.settings.emails;
    if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:subject,text:subject+(to.length?'\n'+to.join(', '):'')});return}catch(e){if(e&&e.name==='AbortError')return}}
    await saveFile(fname,blob,'application/pdf');
    if(to.length)modal('إرسال التقرير بالإيميل',`<p>حُفظ ملف PDF باسم <bdi translate="no">${esc(fname)}</bdi>. اضغط فتح البريد، ثم أرفق الملف من التنزيلات واضغط إرسال.</p>`,[{l:'فتح البريد',c:'pri',f:()=>{openMail(subject,T('مرفق التقرير بصيغة PDF')+': '+fname);closeM()}},{l:'إغلاق',c:'ghost',f:closeM}]);
  }catch(e){const b=document.querySelector('.pdfbox');if(b)b.remove();toast('تعذّر إنشاء PDF، استخدم الطباعة ثم حفظ بصيغة PDF','err');console.warn(e)}
}
function mailReport(z){if(!S.settings.emails.length)return toast('لا توجد إيميلات. يضيفها المدير من الإعدادات.','err');
  openMail(T(`تقرير إقفال اليومية ${z.no}`)+` - ${S.settings.name} - ${fd(z.closedAt)}`,zText(z).split('\n').map(x=>T(x)).join('\n'))}

const PQ=[];let printing=false,pStart=0;

function nextPrint(){const it=PQ.shift();if(!it){printing=false;return}printing=true;pStart=Date.now();
  const o=it.o,lang=o.lang||S.settings.rcptLang||'ar',a4=!!o.a4,pr=$('#print');
  pr.innerHTML=`<div class="paper ${a4?'a4':S.settings.paper==58?'p58':''}" dir="${LANGS[lang].dir}" lang="${lang}">${it.h}</div>`;trNode(pr,lang);
  let st=$('#pgs');if(!st){st=document.createElement('style');st.id='pgs';document.head.appendChild(st)}st.textContent=a4?'@page{size:A4;margin:12mm}':'@page{margin:0}';

async function saveFile(fn,data,type){

  FB.B={};FB.BQ={};FB.F=new Set();
  COLS.forEach(c=>{o[c]={};S[c].forEach((r,i)=>{if(!r._t)r._t=t+i;const j=JSON.stringify(strip(c,r)),k=c+'/'+r.id;o[c][r.id]=j;FB.B[k]=hsh(j);if(isFinal(c,r))FB.F.add(k);
    if(QF[c]){const[n,f]=QF[c];o[n][r.id]=r[f];FB.BQ[n+'/'+r.id]=r[f]}})});
  FB.B.settings=hsh(o.settings);FB.B.day=hsh(JSON.stringify(S.day??null));return o;
}
async function fbUploadAll(){const o=fullObj();await FB.root.set(o);saveLocal();saveBase()}
function fbForceUpload(){modal('رفع بيانات هذا الجهاز للسحابة',`<div class="warnbox">ستُستبدل بيانات السحابة كلها ببيانات هذا الجهاز، وتأخذها كل الأجهزة الأخرى فوراً. استخدمه فقط إذا كان هذا الجهاز هو المرجع الصحيح.</div>`,
  [{l:'رفع واستبدال',c:'dan',f:async()=>{if(!FB.ready)return toast('السحابة غير متصلة','err');try{await fbUploadAll();closeM();toast('رُفعت البيانات للسحابة')}catch(e){toast('تعذّر الرفع: '+e.message,'err')}}},{l:'رجوع',c:'ghost',f:closeM}])}
function fromRemote(rm){
  const R={settings:{...DEFSET,...JSON.parse(rm.settings||'{}')},day:rm.day?JSON.parse(rm.day):null,seq:{order:1,purchase:1,day:1,...(rm.seq||{})},appVer:S.appVer};
  COLS.forEach(c=>{R[c]=Object.values(rm[c]||{}).map(j=>{try{return JSON.parse(j)}catch(e){return null}}).filter(Boolean).sort((a,b)=>(a._t||0)-(b._t||0));
    if(QF[c]){const[n,f]=QF[c],mp=rm[n]||{};R[c].forEach(r=>{if(mp[r.id]!=null)r[f]=mp[r.id]})}});
  return R;
}
function fbAdopt(rm){
  const had=Object.keys(FB.B).length>0,pend=[],deltas=[];let ps=false,pd=false;
  if(had){ // changes made on this device while it was offline
    COLS.forEach(c=>{const ids=new Set();S[c].forEach(r=>{const k=c+'/'+r.id;ids.add(k);if(FB.B[k]!==hsh(JSON.stringify(strip(c,r))))pend.push([c,r]);
        if(QF[c]){const[n,f]=QF[c],old=FB.BQ[n+'/'+r.id];if(old!==undefined&&Math.abs(r[f]-old)>1e-9)deltas.push([c,r.id,r[f]-old])}});
      Object.keys(FB.B).forEach(k=>{if(k.startsWith(c+'/')&&!ids.has(k))pend.push([c,null,k.slice(c.length+1)])})});
    ps=FB.B.settings!==hsh(JSON.stringify(S.settings));pd=FB.B.day!==hsh(JSON.stringify(S.day??null));
  }
  const R=fromRemote(rm),ls=S.settings,ld=S.day;
  FB.B={};FB.BQ={};FB.F=new Set();
  COLS.forEach(c=>{Object.entries(rm[c]||{}).forEach(([id,j])=>FB.B[c+'/'+id]=hsh(j));if(QF[c])Object.entries(rm[QF[c][0]]||{}).forEach(([id,q])=>FB.BQ[QF[c][0]+'/'+id]=q)});
  FB.B.settings=hsh(rm.settings||'');FB.B.day=hsh(rm.day||'null');
  pend.forEach(([c,r,id])=>{const a=R[c];if(r){const i=a.findIndex(x=>x.id===r.id);if(QF[c]&&i>=0){const f=QF[c][1];r={...r,[f]:a[i][f]}}if(i>=0)a[i]=r;else a.push(r)}else{const i=a.findIndex(x=>x.id===id);if(i>=0)a.splice(i,1)}});
  deltas.forEach(([c,id,d])=>{const r=R[c].find(x=>x.id===id),f=QF[c][1];if(r)r[f]=r4(r[f]+d)});
  if(ps)R.settings=ls;if(pd)R.day=ld;
  S=migrate(R);if(U.user)U.user=S.users.find(u=>u.id===U.user.id&&u.active)||null;saveLocal();saveBase();
}
function diffPush(){
  if(!FB.ready)return;const up={},txs=[],seen=new Set(),t=Date.now();
  COLS.forEach(c=>S[c].forEach((r,i)=>{const k=c+'/'+r.id;seen.add(k);if(FB.F.has(k)&&FB.B[k])return;
    if(!r._t)r._t=t+i;const j=JSON.stringify(strip(c,r)),h=hsh(j);if(FB.B[k]!==h){up[k]=j;FB.B[k]=h}if(isFinal(c,r))FB.F.add(k);
    if(QF[c]){const[n,f]=QF[c],qk=n+'/'+r.id,old=FB.BQ[qk];if(old===undefined||old===null){up[qk]=r[f];FB.BQ[qk]=r[f]}else if(Math.abs(r[f]-old)>1e-9){txs.push([qk,r4(r[f]-old)]);FB.BQ[qk]=r[f]}}}));
  Object.keys(FB.B).forEach(k=>{const c=k.split('/')[0];if(k.includes('/')&&COLS.includes(c)&&!seen.has(k)){up[k]=null;delete FB.B[k];FB.F.delete(k);if(QF[c]){const qk=QF[c][0]+'/'+k.slice(c.length+1);up[qk]=null;delete FB.BQ[qk]}}});
  const sj=JSON.stringify(S.settings),dj=JSON.stringify(S.day??null);
  if(FB.B.settings!==hsh(sj)){up.settings=sj;FB.B.settings=hsh(sj)}
  if(FB.B.day!==hsh(dj)){up.day=S.day?dj:null;FB.B.day=hsh(dj)}
  if(Object.keys(up).length)FB.root.update(up).catch(e=>{console.warn('push',e);toast('تعذّر رفع آخر تعديل للسحابة','err')});
  txs.forEach(([k,d])=>FB.root.child(k).transaction(c=>r4((c||0)+d)));
  saveBase();
}
function fbListen(){
  const root=FB.root;
  COLS.forEach(c=>{const ref=root.child(c),up=s=>{const j=s.val(),k=c+'/'+s.key;if(typeof j!=='string'||FB.B[k]===hsh(j))return;let r;try{r=JSON.parse(j)}catch(e){return}
      FB.B[k]=hsh(j);if(isFinal(c,r))FB.F.add(k);const a=S[c],i=a.findIndex(x=>x.id===r.id);
      if(QF[c]){const[n,f]=QF[c],q=FB.BQ[n+'/'+r.id];r[f]=q!=null?q:(i>=0?a[i][f]:0)}
      if(i>=0)a[i]=r;else{a.push(r);a.sort((x,y)=>(x._t||0)-(y._t||0))}remoteChanged(c)};
    ref.on('child_added',up);ref.on('child_changed',up);
    ref.on('child_removed',s=>{const k=c+'/'+s.key;if(!(k in FB.B))return;delete FB.B[k];FB.F.delete(k);S[c]=S[c].filter(x=>x.id!==s.key);remoteChanged(c)})});
  Object.entries(QF).forEach(([c,[n,f]])=>{const up=s=>{const v=s.val();if(v==null)return;FB.BQ[n+'/'+s.key]=v;const r=S[c].find(x=>x.id===s.key);if(r&&r[f]!==v){r[f]=v;remoteChanged(c)}};root.child(n).on('child_added',up);root.child(n).on('child_changed',up)});
  root.child('settings').on('value',s=>{const j=s.val();if(!j||FB.B.settings===hsh(j))return;FB.B.settings=hsh(j);try{S.settings={...DEFSET,...JSON.parse(j)}}catch(e){}remoteChanged('settings')});
  root.child('day').on('value',s=>{const j=s.val()||'null';if(FB.B.day===hsh(j))return;FB.B.day=hsh(j);try{S.day=JSON.parse(j)}catch(e){}remoteChanged('day')});
  root.child('seq').on('value',s=>{const v=s.val();if(v)S.seq={...S.seq,...v}});
}
function fbSeq(name,apply){if(!FB.ready||FB.state!=='online')return;FB.root.child('seq/'+name).transaction(c=>(c||1)+1).then(r=>{if(r&&r.committed)apply(r.snapshot.val()-1)}).catch(()=>{})}
function remoteChanged(c){saveLocal();saveBase();if(c==='users'&&U.user)U.user=S.users.find(u=>u.id===U.user.id&&u.active)||null;clearTimeout(FB.rt);FB.rt=setTimeout(refreshUI,250)}
function refreshUI(){
  if(!U.user){if(!U.loginUser)renderLogin();return}
  const ae=document.activeElement;if($('#modal').innerHTML||(ae&&/^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName))){clearTimeout(FB.rt);FB.rt=setTimeout(refreshUI,1500);return}
  if(U.view==='pos'&&S.day&&(U.cur||U.draft)){const o=cur();if(o&&o.status==='open'&&$('#cart')){renderCart();return}}
  render();
}

const VIEWS={waste:vWaste,hr:vHR,cust:vCust,pos:vPOS,day:vDay,exp:vExp,pur:vPur,inv:vInv,items:vItems,rep:vRep,users:vUsers,set:vSet};
setInterval(()=>{if(U.user&&U.view==='pos'&&U.mode==='dine'&&!cur()&&!$('#modal').innerHTML)vPOS()},60000);
if(S.appVer!==APP_VERSION){if(S.appVer)setTimeout(()=>toast('تم تحديث النظام إلى الإصدار '+APP_VERSION),600);S.appVer=APP_VERSION;save()}
applyLang();
render();
fbInit();
</script>
