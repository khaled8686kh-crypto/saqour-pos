<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>صقور الجديان | نظام الكاشير والمحاسبة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
:root{
  color-scheme:dark;
  --bg:#0A1A33;--bg2:#0D2142;--panel:#112950;--panel2:#17335F;--line:#25497A;
  --ice:#6CCBFF;--ice2:#B4E6FF;--text:#EAF3FF;--muted:#91A9CB;
  --red:#D21034;--red2:#FF5C78;--green:#007229;--green2:#2FC872;--warn:#F5B942;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A1A33}}
:root[data-theme="dark"]{--bg:#0A1A33}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",Arial,sans-serif;font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
.num,.stat .v,td.n{font-variant-numeric:tabular-nums}
svg.i{width:24px;height:24px;stroke:var(--ice);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.muted{color:var(--muted)}
h2{font-size:20px;margin:0 0 12px}h3{font-size:17px;margin:0}

/* Sudan flag band: red / white / black with the green hoist triangle */
.flag{height:7px;flex:none;position:relative;background:linear-gradient(to bottom,var(--red) 0 33.4%,#fff 33.4% 66.6%,#000 66.6%)}
.flag::before{content:"";position:absolute;left:0;top:0;bottom:0;width:22px;background:var(--green);clip-path:polygon(0 0,100% 50%,0 100%)}

#app{height:100%;display:grid;grid-template-columns:96px 1fr}
.side{background:var(--bg2);border-inline-end:1px solid var(--line);display:flex;flex-direction:column;align-items:stretch;gap:4px;padding:12px 8px;overflow-y:auto}
.side .emb{width:52px;height:52px;margin:0 auto 10px}
.nav{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px;border:0;border-radius:12px;background:none;color:var(--muted);font-size:12.5px;cursor:pointer;border-inline-start:3px solid transparent}
.nav:hover{background:var(--panel)}
.nav.on{background:var(--panel2);color:var(--text);border-inline-start-color:var(--red)}
.nav svg.i{width:27px;height:27px}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:12px;padding:10px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.top h1{font-size:19px;margin:0;font-weight:700}
.top .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;font-size:13px;border:1px solid var(--line);background:var(--bg2)}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.pill.ok::before{background:var(--green2)}.pill.no::before{background:var(--red)}
.content{flex:1;overflow:auto;padding:18px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:11px;padding:9px 16px;font-weight:600;cursor:pointer;min-height:44px;white-space:nowrap}
.btn:hover{border-color:var(--ice)}
.btn.pri{background:var(--ice);color:#062043;border-color:var(--ice)}
.btn.ok{background:var(--green);border-color:#0b9440;color:#fff}
.btn.dan{background:transparent;border-color:var(--red);color:var(--red2)}
.btn.ghost{background:transparent}
.btn.sm{min-height:34px;padding:5px 11px;font-size:13.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ice2);outline-offset:2px}
.in{background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:9px 12px;font:inherit;width:100%;min-height:44px}
.in:focus{border-color:var(--ice);outline:none}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13.5px;color:var(--muted)}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}
.stack{display:flex;flex-direction:column;gap:14px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chip{border:1px solid var(--line);background:var(--bg2);border-radius:999px;padding:7px 16px;cursor:pointer;white-space:nowrap;font-size:14px}
.chip.on{background:var(--ice);color:#062043;border-color:var(--ice);font-weight:600}
.seg{display:inline-flex;background:var(--bg2);border:1px solid var(--line);border-radius:13px;padding:4px;gap:4px}
.seg button{display:flex;align-items:center;gap:8px;border:0;background:none;padding:9px 18px;border-radius:10px;cursor:pointer;color:var(--muted);font-weight:600}
.seg button.on{background:var(--panel2);color:var(--text);box-shadow:inset 0 -3px 0 var(--ice)}
.badge{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:999px;margin-inline-start:6px;vertical-align:middle;font-weight:600}
.badge.red{background:rgba(210,16,52,.18);color:var(--red2)}
.badge.ice{background:rgba(108,203,255,.15);color:var(--ice)}
.badge.grn{background:rgba(47,200,114,.15);color:var(--green2)}
.badge.wrn{background:rgba(245,185,66,.15);color:var(--warn)}
.tw{overflow-x:auto}
table.dt{width:100%;border-collapse:collapse;font-size:14px}
.dt th{text-align:start;color:var(--muted);font-weight:500;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.dt td{padding:9px 10px;border-bottom:1px solid rgba(37,73,122,.5)}
.dt tr.click{cursor:pointer}.dt tr.click:hover td{background:var(--bg2)}
.dt tr.low td{color:var(--red2)}
.empty{padding:28px;text-align:center;color:var(--muted)}

/* Login */
.login{min-height:100%;display:flex;flex-direction:column}
.lbox{margin:auto;width:min(520px,100%);padding:28px 18px;text-align:center}
.lbox .emb{width:96px;height:96px}
.lbox h1{margin:10px 0 2px;font-size:28px}
.ulist{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin:18px 0}
.ubtn{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.ubtn small{color:var(--muted)}
.ubtn.on{border-color:var(--ice);background:var(--panel2)}
.dots{display:flex;justify-content:center;gap:12px;margin:8px 0 14px;min-height:16px}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--ice)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:300px;margin:0 auto}
.pad button{min-height:62px;font-size:24px;font-weight:600;border-radius:14px;border:1px solid var(--line);background:var(--panel);cursor:pointer}
.pad button.go{background:var(--ice);color:#062043;font-size:18px}
.hint{color:var(--warn);font-size:13px;margin-top:16px}

/* Tables */
.tsum{display:flex;gap:18px;flex-wrap:wrap;margin:14px 0}
.tables{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:10px}
.tbl{min-height:104px;border-radius:15px;border:1.5px dashed var(--line);background:var(--bg2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;color:var(--muted);font-size:12.5px;position:relative}
.tbl .n{font-size:27px;font-weight:700;color:var(--text);line-height:1.1}
.tbl.open{border-style:solid;border-color:var(--ice);background:linear-gradient(170deg,var(--panel2),var(--panel))}
.tbl.open .n{color:var(--ice)}
.tbl .tt{color:var(--text);font-weight:600}
.tbl.kit::after{content:"";position:absolute;inset:auto 10px 7px;height:4px;border-radius:4px;background:var(--red)}
.tbl.chg .tm{color:var(--warn)}

/* Order */
.order{display:grid;grid-template-columns:1fr 390px;gap:16px;min-height:100%}
.mwrap{display:flex;flex-direction:column;gap:12px;min-width:0}
.ohead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;align-content:start}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;min-height:88px;text-align:start;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;gap:6px}
.tile:hover{border-color:var(--ice)}
.tile:active{transform:scale(.97)}
.tile b{font-weight:600;font-size:15px}
.tile span{color:var(--ice);font-weight:700}
.cart{background:var(--panel);border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;overflow:hidden;position:sticky;top:0;max-height:calc(100vh - 120px)}
.ch{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}
.ch b{font-size:18px}
.lines{flex:1 1 auto;overflow-y:auto;padding:6px 10px;min-height:70px}
.cart>.ch,.cart>.custbar,.cart>.tots,.cart>.acts{flex:none}
.ln{display:grid;grid-template-columns:1fr auto auto auto;gap:8px;align-items:center;padding:9px 4px;border-bottom:1px solid rgba(37,73,122,.5)}
.ln .nm small{display:block;color:var(--warn);font-size:12px}
.ln.gone .nm{text-decoration:line-through;color:var(--muted)}
.qty{display:flex;align-items:center;gap:6px}
.qty button,.ic{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--bg2);cursor:pointer;font-size:18px;line-height:1}
.qty b{min-width:22px;text-align:center}
.lt{min-width:62px;text-align:end;font-weight:600}
.tots{padding:12px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:4px;font-size:14px}
.tots div{display:flex;justify-content:space-between}
.tots .g{font-size:22px;font-weight:700;color:var(--ice);margin-top:4px}
.acts{display:flex;flex-direction:column;gap:8px;padding:0 12px 12px}
.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tools .btn{min-height:40px;padding:4px 6px;font-size:13px;white-space:normal;line-height:1.25}
.acts .w{grid-column:1/-1}
.acts .btn.big{min-height:56px;font-size:18px}
.custbar{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);font-size:14px}
.custbar>span{flex:1}
.payrow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:10px;border:1px solid var(--line);border-radius:14px;background:var(--bg2)}
.payrow .btn.big{min-height:58px;font-size:18px;padding:6px}
.payrow>span{grid-column:1/-1;font-size:14px}
.payrow .btn.sm{grid-column:1/-1}
.btn.cr{background:var(--warn);color:#2a1a00;border-color:var(--warn)}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:10px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stat small{color:var(--muted);font-size:13px;display:block}
.stat .v{font-size:21px;font-weight:700}
.stat.cash{border-inline-start:4px solid var(--green2)}.stat.net{border-inline-start:4px solid var(--ice)}.stat.cr{border-inline-start:4px solid var(--warn)}.stat.bad{border-inline-start:4px solid var(--red)}
.stat.hero{background:var(--panel2);border-color:var(--ice)}.stat.hero .v{color:var(--ice);font-size:26px}
.den{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.den label{display:flex;align-items:center;gap:6px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:4px 8px;font-size:13.5px}
.den label b{min-width:34px}
.den .in{min-height:36px;padding:4px 8px}
.diff{font-size:20px;font-weight:700}
.pos{color:var(--green2)}.neg{color:var(--red2)}

/* Expenses */
.amt{font-size:30px;font-weight:700;text-align:center;min-height:64px}

/* Modal & toast */
.mb{position:fixed;inset:0;background:rgba(3,10,26,.72);display:flex;align-items:center;justify-content:center;z-index:50;padding:14px}
.md{background:var(--panel);border:1px solid var(--line);border-radius:18px;width:min(560px,100%);max-height:92vh;display:flex;flex-direction:column}
.md.wide{width:min(860px,100%)}
.mh{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.mh .x{border:0;background:none;font-size:26px;cursor:pointer;color:var(--muted);width:40px;height:40px}
.mbody{padding:16px 18px;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.mf{display:flex;gap:8px;justify-content:flex-start;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.paytot{display:flex;justify-content:space-between;align-items:center;background:var(--bg2);border-radius:12px;padding:12px 16px}
.paytot b{font-size:30px;color:var(--ice)}
.msg{font-size:14px;min-height:20px}
.warnbox{background:rgba(245,185,66,.1);border:1px solid rgba(245,185,66,.35);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:14px}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translate(-50%,30px);background:var(--panel2);border:1px solid var(--ice);padding:11px 20px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:80;max-width:90vw}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.err{border-color:var(--red)}
#print{display:none}

@media (max-width:820px){
  #app{grid-template-columns:1fr;grid-template-rows:1fr auto}
  .side{order:2;flex-direction:row;overflow-x:auto;border-inline-end:0;border-top:1px solid var(--line);padding:6px}
  .side .emb{display:none}
  .nav{min-width:72px;border-inline-start:0;border-bottom:3px solid transparent}
  .nav.on{border-bottom-color:var(--red)}
  .main{order:1;overflow:hidden}
  .order{grid-template-columns:1fr}
  .cart{position:static;max-height:none}
  .content{padding:12px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

@media print{
  @page{margin:0}
  body{background:#fff}
  #app,#modal,#toast{display:none!important}
  #print{display:block!important;color:#000;background:#fff}
}
.paper{width:72mm;padding:3mm;font-family:Tahoma,Arial,sans-serif;font-size:12px;color:#000;direction:rtl}
.paper.p58{width:48mm;font-size:11px}
.paper .c{text-align:center}
.paper .big{font-size:16px;display:block}
.paper .huge{font-size:22px;font-weight:700;margin:3px 0}
.paper hr{border:0;border-top:1px dashed #000;margin:5px 0}
.paper .r{display:flex;justify-content:space-between}
.paper .g{font-size:15px;font-weight:700}
.paper table{width:100%;border-collapse:collapse}
.paper td{padding:2px 0;vertical-align:top}
.paper td.q{width:22%;font-weight:700}
.paper td.e{text-align:left;white-space:nowrap}
.paper table.k td{font-size:15px;padding:4px 0;border-bottom:1px dotted #000}
.paper .cx td{text-decoration:line-through}
.paper .nt{font-size:12px}
.paper .qr{text-align:center;margin-top:6px}
.paper .qr svg{width:34mm;height:34mm}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="print"></div>
<script>
/* ============ Core ============ */
const K='saqour_pos_v1';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const r2=n=>Math.round((Number(n)||0)*100)/100;
const r4=n=>Math.round((Number(n)||0)*10000)/10000;
const m=n=>(Number(n)||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const pad=n=>String(n).padStart(2,'0');
const fdt=t=>{const d=new Date(t);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`};
const fd=t=>fdt(t).slice(0,10), ft=t=>fdt(t).slice(11);
const today=()=>fd(Date.now());
const num=v=>{const x=parseFloat(String(v).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(',', '.'));return isFinite(x)?x:0};
const PAY={cash:'كاش',net:'شبكة',cr:'آجل'};
const EXPC=['رواتب وأجور','إيجار','كهرباء ومياه','صيانة','نظافة','نقل وتوصيل','ضيافة','نثريات','أخرى'];
const DEFSET={name:'مقهى صقور الجديان',phone:'',vatNo:'',vat:15,vatIncluded:true,paper:80,autoReceipt:true,autoKitchen:true,adminVoid:true,tables:50,footer:'شكراً لزيارتكم، نسعد بخدمتكم دائماً',loyaltyOn:true,ptsPerSar:1,ptValue:0.05,minRedeem:100,emails:[],lastBackup:0};
const APP_VERSION='1.2';

function seed(){
  const inv=[['بن سوداني (جبنة)','كجم',5,60,1],['بن إسبريسو','كجم',4,95,1],['حليب طازج','لتر',30,6,10],['سكر','كجم',20,4.5,5],['شاي','كجم',3,40,1],['كركدي','كجم',3,30,1],['زنجبيل','كجم',2,18,.5],['قرفة','كجم',1,45,.2],['قنقليز','كجم',2,35,.5],['أكواب ورقية','حبة',500,.25,100],['كيك','قطعة',20,3,5],['كرواسون','قطعة',20,2.5,5]]
    .map(([name,unit,qty,cost,min])=>({id:uid(),name,unit,qty,cost,min}));
  const I=n=>inv.find(x=>x.name===n).id;
  const cats=['المشروبات السودانية','القهوة','المشروبات الباردة','الحلويات'].map(name=>({id:uid(),name}));
  const cup=['أكواب ورقية',1];
  const items=[
    ['جبنة سودانية',0,8,[['بن سوداني (جبنة)',.015],['زنجبيل',.003],['سكر',.01],cup]],
    ['شاي باللبن',0,5,[['شاي',.004],['حليب طازج',.15],['سكر',.015],cup]],
    ['شاي سادة',0,3,[['شاي',.004],['سكر',.015],cup]],
    ['شاي بالقرفة',0,4,[['شاي',.004],['قرفة',.002],['سكر',.015],cup]],
    ['كركدي ساخن',0,5,[['كركدي',.012],['سكر',.02],cup]],
    ['إسبريسو',1,9,[['بن إسبريسو',.018],cup]],
    ['كابتشينو',1,14,[['بن إسبريسو',.018],['حليب طازج',.18],cup]],
    ['لاتيه',1,15,[['بن إسبريسو',.018],['حليب طازج',.22],cup]],
    ['كركدي بارد',2,8,[['كركدي',.015],['سكر',.03],cup]],
    ['عصير قنقليز',2,10,[['قنقليز',.03],['سكر',.03],cup]],
    ['آيس لاتيه',2,16,[['بن إسبريسو',.018],['حليب طازج',.2],cup]],
    ['كيك',3,8,[['كيك',1]]],
    ['كرواسون',3,7,[['كرواسون',1]]]
  ].map(([name,c,price,rec])=>({id:uid(),name,catId:cats[c].id,price,active:true,recipe:rec.map(([n,q])=>({invId:I(n),qty:q}))}));
  return {v:1,settings:{...DEFSET},
    users:[{id:uid(),name:'المدير',pin:'1234',role:'admin',active:true},{id:uid(),name:'كاشير 1',pin:'1111',role:'cashier',active:true}],
    cats,items,inv,customers:[],purchases:[],expenses:[],orders:[],collections:[],adjust:[],closings:[],day:null,seq:{order:1,purchase:1,day:1}};
}
function migrate(o){
  ['users','cats','items','inv','customers','purchases','expenses','orders','collections','adjust','closings'].forEach(k=>{if(!Array.isArray(o[k]))o[k]=[]});
  o.settings={...DEFSET,...(o.settings||{})};o.seq={order:1,purchase:1,day:1,...(o.seq||{})};if(o.day===undefined)o.day=null;return o;
}
let storeOK=true;
function load(){try{const r=localStorage.getItem(K);if(r)return migrate(JSON.parse(r))}catch(e){storeOK=false}return seed()}
let S=load();

/* ============ Helpers ============ */
const invOf=id=>S.inv.find(x=>x.id===id);
const itemOf=id=>S.items.find(x=>x.id===id);
const ord=id=>S.orders.find(o=>o.id===id);
const custOf=id=>S.customers.find(c=>c.id===id);
const isAdmin=()=>U.user&&U.user.role==='admin';
const cur=()=>U.cur?ord(U.cur):U.draft;
const itemCost=it=>r4((it.recipe||[]).reduce((a,r)=>{const v=invOf(r.invId);return a+(v?v.cost*r.qty:0)},0));
const hasChanges=o=>o.lines.some(l=>l.qty!==l.sentQty);
function totals(o){
  const sub=o.lines.reduce((a,l)=>a+l.price*l.qty,0),disc=Math.min((o.discount||0)+(o.ptsDisc||0),sub),v=S.settings.vat/100,base=sub-disc;
  let total,vat;if(S.settings.vatIncluded){total=base;vat=base-base/(1+v)}else{vat=base*v;total=base+vat}
  return{sub:r2(sub),disc:r2(disc),vat:r2(vat),total:r2(total),net:r2(total-vat)};
}
function toast(msg,type){const t=$('#toast');t.textContent=msg;t.className='show '+(type||'');clearTimeout(toast.h);toast.h=setTimeout(()=>t.className='',2800)}
function modal(title,body,actions=[],wide){
  U.ma=actions;
  $('#modal').innerHTML=`<div class="mb" onclick="if(event.target===this)closeM()"><div class="md ${wide?'wide':''}" role="dialog" aria-modal="true"><div class="mh"><h3>${title}</h3><button class="x" onclick="closeM()" aria-label="إغلاق">×</button></div><div class="mbody" id="mbody">${body}</div><div class="mf">${actions.map((a,i)=>`<button class="btn ${a.c||''}" onclick="U.ma[${i}].f()">${a.l}</button>`).join('')}</div></div></div>`;
  const f=$('#modal [autofocus]');if(f)setTimeout(()=>{f.focus();f.select&&f.select()},40);
}
function closeM(){$('#modal').innerHTML=''}
function deduct(lines,field){let cost=0;lines.forEach(l=>{const it=itemOf(l.itemId),q=l[field];if(!it||!q)return;(it.recipe||[]).forEach(r=>{const v=invOf(r.invId);if(v){v.qty=r4(v.qty-r.qty*q);cost+=v.cost*r.qty*q}})});return r2(cost)}

/* ============ Shell ============ */
const NAV=[{k:'pos',t:'البيع',i:'cup'},{k:'day',t:'اليومية',i:'receipt'},{k:'exp',t:'المصروفات',i:'wallet'},{k:'cust',t:'العملاء',i:'star'},{k:'pur',t:'المشتريات',i:'truck',a:1},{k:'inv',t:'المخزون',i:'box',a:1},{k:'items',t:'الأصناف',i:'list',a:1},{k:'rep',t:'التقارير',i:'chart',a:1},{k:'users',t:'المستخدمون',i:'users',a:1},{k:'set',t:'الإعدادات',i:'gear',a:1}];
function render(){
  if(!U.user)return renderLogin();
  const nav=NAV.filter(n=>!n.a||isAdmin()),title=NAV.find(n=>n.k===U.view).t;
  $('#app').innerHTML=`<aside class="side">${EMB}${nav.map(n=>`<button class="nav ${U.view===n.k?'on':''}" onclick="go('${n.k}')">${ICON(n.i)}<span>${n.t}</span></button>`).join('')}</aside>
  <main class="main"><div class="flag"></div><header class="top"><h1>${title}</h1><span class="pill ${S.day?'ok':'no'}">${S.day?`اليومية رقم ${S.day.no} مفتوحة منذ ${ft(S.day.openedAt)}`:'لا توجد يومية مفتوحة'}</span><span class="pill" id="syncp"></span><span class="sp"></span><span class="muted">${esc(U.user.name)}</span><button class="btn sm ghost" onclick="checkUpdate()" title="تحميل آخر نسخة من النظام">${ICON('sync')}تحديث</button><button class="btn sm ghost" onclick="logout()">${ICON('out')}خروج</button></header><div class="content" id="content"></div></main>`;
  VIEWS[U.view]();syncPill();
}
function go(k){U.view=k;if(k!=='pos'){U.cur=null;U.draft=null}render()}
function logout(){U.user=null;U.cur=null;U.draft=null;U.loginUser=null;U.pin='';render()}

/* ============ Login ============ */
function renderLogin(){
  const us=S.users.filter(u=>u.active),hint=S.users.some(u=>u.role==='admin'&&u.pin==='1234');
  $('#app').innerHTML=`<div class="login" style="grid-column:1/-1"><div class="flag"></div><div class="lbox">${EMB}<h1>${esc(S.settings.name)}</h1><p class="muted">اختر اسمك ثم أدخل رمزك السري</p>
  <div class="ulist">${us.map(u=>`<button class="ubtn ${U.loginUser===u.id?'on':''}" onclick="pickU('${u.id}')"><b>${esc(u.name)}</b><small>${u.role==='admin'?'مدير':'كاشير'}</small></button>`).join('')}</div>
  ${U.loginUser?`<div class="dots" id="dots"></div><div class="pad">${[1,2,3,4,5,6,7,8,9].map(d=>`<button onclick="pk('${d}')">${d}</button>`).join('')}<button onclick="pk('c')" style="font-size:16px">مسح</button><button onclick="pk('0')">0</button><button class="go" onclick="pk('ok')">دخول</button></div>`:''}
  ${hint?'<p class="hint">رمز المدير الافتراضي 1234. غيّره من شاشة المستخدمين بعد الدخول.</p>':''}</div></div>`;
  dots();
}
function dots(){const d=$('#dots');if(d)d.innerHTML=U.pin.split('').map(()=>'<i></i>').join('')}
function pickU(id){U.loginUser=id;U.pin='';renderLogin()}
function pk(d){if(d==='c')U.pin='';else if(d==='ok')return tryLogin();else if(U.pin.length<8)U.pin+=d;dots()}
function tryLogin(){const u=S.users.find(x=>x.id===U.loginUser);if(u&&u.pin===U.pin){U.user=u;U.pin='';U.loginUser=null;U.view='pos';render()}else{U.pin='';dots();toast('الرمز غير صحيح','err')}}
document.addEventListener('keydown',e=>{if(U.user||!U.loginUser)return;if(/^[0-9]$/.test(e.key))pk(e.key);else if(e.key==='Backspace'){U.pin=U.pin.slice(0,-1);dots()}else if(e.key==='Enter')pk('ok')});

/* ============ POS ============ */
function noDay(){return `<div class="panel" style="max-width:460px;margin:30px auto" ><h2>ابدأ اليومية لفتح البيع</h2><p class="muted">أدخل مبلغ العهدة (النقد الموجود في الدرج) عند بداية الوردية.</p><label class="f">عهدة بداية اليوم (ريال)<input class="in amt" id="opc" inputmode="decimal" value="0" autofocus onkeydown="if(event.key==='Enter')openDay()"></label><div style="margin-top:12px"><button class="btn pri" style="width:100%" onclick="openDay()">فتح اليومية</button></div></div>`}
function openDay(){S.day={id:uid(),no:S.seq.day++,openedAt:Date.now(),openedBy:U.user.name,opening:r2(num($('#opc').value))};S.seq.order=1;save();if(FB.ready){FB.root.child('seq/order').set(1);fbSeq('day',n=>{if(S.day&&S.day.no!==n){S.day.no=n;save();render()}})}toast('فُتحت اليومية، بالتوفيق');render()}
function newOrder(type,table){return{id:uid(),no:null,type,table:table||null,lines:[],status:'open',discount:0,createdAt:Date.now(),createdBy:U.user.name,dayId:S.day.id,rounds:0}}
function setMode(md){U.mode=md;U.cur=null;U.draft=null;vPOS()}
const modeTabs=()=>`<div class="seg"><button class="${U.mode==='dine'?'on':''}" onclick="setMode('dine')">${ICON('table')}محلي (طاولات)</button><button class="${U.mode==='take'?'on':''}" onclick="setMode('take')">${ICON('bag')}سفري</button></div>`;
function vPOS(){
  const c=$('#content');if(!S.day){c.innerHTML=noDay();return}
  const o0=U.cur&&ord(U.cur);if(U.cur&&(!o0||o0.status!=='open'))U.cur=null;
  if(U.mode==='dine'&&!cur()){c.innerHTML=modeTabs()+tablesGrid();return}
  if(U.mode==='take'&&!cur())U.draft=newOrder('take');
  const o=cur(),held=S.orders.filter(x=>x.status==='open'&&x.type==='take'&&x.id!==o.id);
  c.innerHTML=`<div class="order"><section class="mwrap"><div class="ohead">${U.mode==='dine'?`<button class="btn" onclick="backTables()">${ICON('back')}الطاولات</button><h2 style="margin:0">طاولة ${o.table}</h2>`:modeTabs()+`<button class="btn sm" onclick="newTake()">طلب سفري جديد</button>`}</div>
  ${held.length?`<div class="chips"><span class="muted" style="align-self:center">طلبات سفري معلّقة:</span>${held.map(h=>`<button class="chip" onclick="recall('${h.id}')">#${h.no} · ${m(totals(h).total)}</button>`).join('')}</div>`:''}
  <div class="chips" id="cats"></div><input class="in" placeholder="ابحث عن صنف بالاسم" value="${esc(U.q)}" oninput="U.q=this.value;renderMenu()"><div class="menu" id="menu"></div></section><aside class="cart" id="cart"></aside></div>`;
  renderMenu();renderCart();
}
function tablesGrid(){
  const open=S.orders.filter(o=>o.status==='open'&&o.type==='dine');let val=0;
  let h='';for(let i=1;i<=S.settings.tables;i++){const o=open.find(x=>x.table===i);
    if(o){const t=totals(o);val+=t.total;const mins=Math.floor((Date.now()-o.createdAt)/60000),ch=hasChanges(o);
      h+=`<button class="tbl open ${o.rounds?'kit':''} ${ch?'chg':''}" onclick="openTable(${i})" aria-label="طاولة ${i} مفتوحة"><span class="n">${i}</span><span class="tt num">${m(t.total)}</span><span class="tm">${ch?'غير مُرسَل':o.rounds?'بالمطبخ':''} ${mins} د</span></button>`}
    else h+=`<button class="tbl" onclick="openTable(${i})" aria-label="طاولة ${i} متاحة"><span class="n">${i}</span><span class="tm">متاحة</span></button>`}
  return `<div class="tsum"><span class="badge ice">طاولات مفتوحة: ${open.length}</span><span class="badge grn">متاحة: ${S.settings.tables-open.length}</span><span class="badge wrn">قيمة الطاولات المفتوحة: ${m(val)}</span><span class="badge red">الخط الأحمر = أُرسلت للمطبخ</span></div><div class="tables">${h}</div>`;
}
function openTable(i){const o=S.orders.find(x=>x.status==='open'&&x.type==='dine'&&x.table===i);if(o){U.cur=o.id;U.draft=null}else{U.cur=null;U.draft=newOrder('dine',i)}U.cat='all';U.q='';vPOS()}
function backTables(){U.cur=null;U.draft=null;vPOS()}
function newTake(){U.cur=null;U.draft=null;vPOS()}
function recall(id){U.cur=id;U.draft=null;vPOS()}
function renderMenu(){
  const cs=$('#cats');if(!cs)return;
  cs.innerHTML=[{id:'all',name:'الكل'},...S.cats].map(c=>`<button class="chip ${U.cat===c.id?'on':''}" onclick="U.cat='${c.id}';renderMenu()">${esc(c.name)}</button>`).join('');
  const q=U.q.trim();const its=S.items.filter(i=>i.active&&(U.cat==='all'||i.catId===U.cat)&&(!q||i.name.includes(q)));
  $('#menu').innerHTML=its.length?its.map(i=>`<button class="tile" onclick="addItem('${i.id}')"><b>${esc(i.name)}</b><span class="num">${m(i.price)}</span></button>`).join(''):'<div class="empty">لا توجد أصناف هنا. أضفها من شاشة الأصناف.</div>';
}
function ensureSaved(o){if(!U.cur&&U.draft===o){o.no=S.seq.order++;S.orders.push(o);U.cur=o.id;U.draft=null;fbSeq('order',n=>{if(o.no!==n){o.no=n;save();if(cur()===o)renderCart()}})}}
function addItem(id){const o=cur(),it=itemOf(id);ensureSaved(o);const l=o.lines.find(x=>x.itemId===id&&!x.note);if(l)l.qty++;else o.lines.push({id:uid(),itemId:id,name:it.name,price:it.price,qty:1,sentQty:0,note:''});save();renderCart()}
function q(lid,d){const o=cur(),l=o.lines.find(x=>x.id===lid);if(!l)return;l.qty=Math.max(0,l.qty+d);if(l.qty===0&&!l.sentQty)o.lines=o.lines.filter(x=>x!==l);save();renderCart()}
function lnote(lid){const o=cur(),l=o.lines.find(x=>x.id===lid);modal('ملاحظة للمطبخ: '+esc(l.name),`<input class="in" id="lnt" value="${esc(l.note)}" placeholder="مثال: سكر خفيف، بدون حليب" autofocus onkeydown="if(event.key==='Enter')U.ma[0].f()"><div class="chips">${['سكر خفيف','بدون سكر','سكر زيادة','حليب زيادة','بارد','مستعجل'].map(t=>`<button class="chip" onclick="$('#lnt').value=($('#lnt').value?$('#lnt').value+'، ':'')+'${t}'">${t}</button>`).join('')}</div>`,
  [{l:'حفظ الملاحظة',c:'pri',f:()=>{const v=$('#lnt').value.trim();if(v!==l.note&&l.sentQty&&l.qty){ // split: noted portion becomes a new unsent line
      o.lines.push({id:uid(),itemId:l.itemId,name:l.name,price:l.price,qty:1,sentQty:0,note:v});l.qty--;if(!l.qty&&!l.sentQty)o.lines=o.lines.filter(x=>x!==l)}else l.note=v;save();closeM();renderCart()}}])}
function renderCart(){
  const o=cur(),el=$('#cart');if(!el)return;const t=totals(o),custC=o.custId?custOf(o.custId):null,live=o.lines.filter(l=>l.qty>0),ch=hasChanges(o);
  el.innerHTML=`<div class="ch"><b>${o.type==='dine'?'طاولة '+o.table:'سفري'}${o.no?` <span class="muted num" style="font-size:14px">#${o.no}</span>`:''}</b><span class="muted" style="font-size:13px">${o.rounds?`أُرسل للمطبخ ${o.rounds} مرة`:'لم يُرسل للمطبخ'}</span></div>
  <div class="custbar">${custC?`${ICON('star')}<span><b>${esc(custC.name)}</b> <span class="muted num">${esc(custC.phone)}</span> <span class="badge wrn">${custC.points} نقطة</span></span><button class="btn sm ghost" onclick="pickCust()">تغيير</button>`:`<button class="btn sm ghost" onclick="pickCust()" style="width:100%">${ICON('star')}إضافة عميل للفاتورة (نقاط الولاء)</button>`}</div>
  <div class="lines">${o.lines.length?o.lines.map(l=>`<div class="ln ${l.qty===0?'gone':''}"><div class="nm">${esc(l.name)}${l.sentQty&&l.qty===l.sentQty?'<span class="badge red">بالمطبخ</span>':''}${l.qty>l.sentQty&&l.sentQty?`<span class="badge ice">+${l.qty-l.sentQty} جديد</span>`:''}${l.qty<l.sentQty?`<span class="badge wrn">إلغاء ${l.sentQty-l.qty}</span>`:''}${l.note?`<small>${esc(l.note)}</small>`:''}<div class="muted num" style="font-size:12.5px">${m(l.price)}</div></div>
  <div class="qty"><button onclick="q('${l.id}',-1)" aria-label="إنقاص">−</button><b class="num">${l.qty}</b><button onclick="q('${l.id}',1)" aria-label="زيادة">+</button></div><div class="lt num">${m(l.price*l.qty)}</div><button class="ic" onclick="lnote('${l.id}')" aria-label="ملاحظة" title="ملاحظة">✎</button></div>`).join(''):'<div class="empty">اضغط على الأصناف لإضافتها للفاتورة</div>'}</div>
  <div class="tots"><div><span class="muted">المجموع</span><span class="num">${m(t.sub)}</span></div><div><span class="muted">ضريبة القيمة المضافة ${S.settings.vat}%${S.settings.vatIncluded?' (شاملة)':''}</span><span class="num">${m(t.vat)}</span></div><div class="g"><span>الإجمالي</span><span class="num">${m(t.total)}</span></div></div>
  <div class="acts">
    <div class="tools"><button class="btn" onclick="sendKitchen()" ${ch?'':'disabled'}>إرسال للمطبخ</button><button class="btn" onclick="preBill()" ${live.length?'':'disabled'}>طباعة الحساب</button><button class="btn" onclick="payModal()" ${live.length?'':'disabled'}>تقسيم الدفع</button>${o.type==='dine'?`<button class="btn" onclick="moveModal()" ${o.no?'':'disabled'}>نقل الطاولة</button>`:`<button class="btn" onclick="holdTake()" ${o.no?'':'disabled'}>تعليق الطلب</button>`}</div>
    <div class="payrow"><button class="btn ok big" onclick="payModal('cash')" ${live.length?'':'disabled'}>كاش</button><button class="btn pri big" onclick="payModal('net')" ${live.length?'':'disabled'}>شبكة</button><button class="btn cr big" onclick="payModal('cr')" ${live.length?'':'disabled'}>آجل</button><button class="btn dan big" onclick="voidModal()" ${o.lines.length||o.no?'':'disabled'}>إلغاء</button></div>
  </div>`;
}
function kitchenChanges(o){return o.lines.filter(l=>l.qty!==l.sentQty).map(l=>({name:l.name,note:l.note,d:l.qty-l.sentQty}))}
function sendKitchen(silent){
  const o=cur();const ch=kitchenChanges(o);if(!ch.length){if(!silent)toast('لا توجد أصناف جديدة للإرسال');return}
  if(S.settings.autoKitchen)printHTML(kitTicket(o,ch));
  o.lines.forEach(l=>l.sentQty=l.qty);o.lines=o.lines.filter(l=>l.qty>0);o.rounds++;o.sentAt=Date.now();save();
  if(silent)return;toast('أُرسل الطلب للمطبخ');
  if(o.type==='dine'){U.cur=null;U.draft=null;vPOS()}else renderCart();
}
function holdTake(){U.cur=null;U.draft=null;toast('عُلّق الطلب، تجده في الطلبات المعلقة');vPOS()}
function preBill(){printHTML(receipt(cur(),true))}
function moveModal(){const o=cur(),busy=S.orders.filter(x=>x.status==='open'&&x.type==='dine').map(x=>x.table);let h='<div class="tables" style="grid-template-columns:repeat(auto-fill,minmax(64px,1fr))">';
  for(let i=1;i<=S.settings.tables;i++)if(!busy.includes(i))h+=`<button class="tbl" style="min-height:60px" onclick="moveTo(${i})"><span class="n" style="font-size:20px">${i}</span></button>`;
  modal(`نقل طاولة ${o.table} إلى`,h+'</div>',[],true)}

function payPts(){const o=cur(),c=o.custId&&custOf(o.custId),e=$('#ppts');if(!c||!e)return 0;const sub=o.lines.reduce((a,l)=>a+l.price*l.qty,0)-Math.max(0,num($('#pd').value));return Math.max(0,Math.min(Math.floor(num(e.value)),c.points,S.settings.ptValue>0?Math.ceil(Math.max(0,sub)/S.settings.ptValue):0))}
function payTotal(){const o=cur(),d=num($('#pd').value);const keep=[o.discount,o.ptsDisc];o.discount=Math.max(0,d);o.ptsDisc=r2(payPts()*S.settings.ptValue);const t=totals(o);o.discount=keep[0];o.ptsDisc=keep[1];return t}
function payAll(k){const t=payTotal();['pc','pn','pa'].forEach(id=>$('#'+id).value=0);$({cash:'#pc',net:'#pn',cr:'#pa'}[k]).value=t.total;payCalc()}
function payCalc(discChanged){
  const t=payTotal();$('#ptot').textContent=m(t.total);
  if(discChanged){$('#pc').value=t.total;$('#pn').value=0;$('#pa').value=0}
  const c=num($('#pc').value),n=num($('#pn').value),a=num($('#pa').value),rem=r2(t.total-c-n-a);
  $('#crbox').hidden=!(a>0);const rec=num($('#pr').value);$('#pchg').textContent=m(rec>c?rec-c:0);
  $('#pmsg').innerHTML=Math.abs(rem)<.01?'<span class="pos">المبالغ مطابقة للإجمالي</span>':rem>0?`<span class="neg">متبقٍ ${m(rem)} لم يُوزّع</span>`:`<span class="neg">المبالغ تزيد عن الإجمالي بـ ${m(-rem)}</span>`;
}
function confirmPay(){

/* ============ Day / closing ============ */
function daySum(dayId,opening){
  const os=S.orders.filter(o=>o.dayId===dayId),s={count:0,cash:0,net:0,cr:0,disc:0,vat:0,total:0,cogs:0,dine:0,take:0,voids:0,voidVal:0,waste:0,open:0,expCash:0,expNet:0,purCash:0,purNet:0,purCr:0,colCash:0,colNet:0};
  os.forEach(o=>{if(o.status==='paid'){s.count++;s.cash+=o.pay.cash;s.net+=o.pay.net;s.cr+=o.pay.cr;s.disc+=o.tot.disc;s.vat+=o.tot.vat;s.total+=o.tot.total;s.cogs+=o.cogs;s[o.type]+=o.tot.total}else if(o.status==='void'){s.voids++;s.voidVal+=o.tot?o.tot.total:0;s.waste+=o.waste||0}else s.open++});
  S.expenses.filter(e=>e.dayId===dayId).forEach(e=>e.pay==='cash'?s.expCash+=e.amount:s.expNet+=e.amount);
  S.purchases.filter(p=>p.dayId===dayId).forEach(p=>p.pay==='cash'?s.purCash+=p.total:p.pay==='net'?s.purNet+=p.total:s.purCr+=p.total);
  S.collections.filter(c=>c.dayId===dayId).forEach(c=>c.pay==='cash'?s.colCash+=c.amount:s.colNet+=c.amount);
  Object.keys(s).forEach(k=>s[k]=r2(s[k]));
  s.opening=r2(opening);s.gross=r2(s.total-s.vat-s.cogs);s.expected=r2(s.opening+s.cash+s.colCash-s.expCash-s.purCash);
  return s;
}
const stat=(l,v,cls='',sub='')=>`<div class="stat ${cls}"><small>${l}</small><div class="v">${v}</div>${sub?`<small>${sub}</small>`:''}</div>`;

  c.innerHTML=`<div class="stack">
  <div class="stats">${stat('إجمالي المبيعات',m(s.total),'hero',`${s.count} فاتورة · محلي ${m(s.dine)} · سفري ${m(s.take)}`)}${stat('مبيعات الكاش',m(s.cash),'cash')}${stat('مبيعات الشبكة',m(s.net),'net')}${stat('مبيعات الآجل',m(s.cr),'cr')}

  ${stat('فواتير ملغاة',s.voids,'bad',`قيمتها ${m(s.voidVal)} · هدر ${m(s.waste)}`)}${stat('عهدة البداية',m(s.opening))}${stat('النقد المتوقع في الدرج',m(s.expected),'hero','العهدة + الكاش + التحصيل − المصروفات والمشتريات النقدية')}</div>

/* ============ Reports ============ */
function vRep(){
  const inR=t=>{const d=fd(t);return d>=U.rf&&d<=U.rt};
  const paid=S.orders.filter(o=>o.status==='paid'&&inR(o.paidAt)),exps=S.expenses.filter(e=>inR(e.date));
  const s={total:0,vat:0,cogs:0,cash:0,net:0,cr:0,disc:0};paid.forEach(o=>{s.total+=o.tot.total;s.vat+=o.tot.vat;s.cogs+=o.cogs;s.disc+=o.tot.disc;s.cash+=o.pay.cash;s.net+=o.pay.net;s.cr+=o.pay.cr});
  const waste=S.orders.filter(o=>o.status==='void'&&inR(o.voidAt)).reduce((a,o)=>a+(o.waste||0),0),adj=S.adjust.filter(a=>inR(a.date)).reduce((x,a)=>x+a.value,0);
  const expT=exps.reduce((a,e)=>a+e.amount,0),netSales=s.total-s.vat,gross=netSales-s.cogs,np=gross-expT-waste+adj;
  const im={};paid.forEach(o=>{const share=o.tot.sub?o.tot.total/o.tot.sub:1;o.lines.forEach(l=>{const k=l.name;im[k]=im[k]||{q:0,rev:0,cost:0};im[k].q+=l.qty;im[k].rev+=l.price*l.qty*share;const it=itemOf(l.itemId);im[k].cost+=it?itemCost(it)*l.qty:0})});
  const ec={};exps.forEach(e=>ec[e.cat]=(ec[e.cat]||0)+e.amount);
  const recv={};U.recv=[];S.orders.filter(o=>o.status==='paid'&&o.pay.cr>0).forEach(o=>recv[o.customer]=(recv[o.customer]||0)+o.pay.cr);S.collections.forEach(c=>recv[c.customer]=(recv[c.customer]||0)-c.amount);
  const q=(f,t)=>`U.rf='${f}';U.rt='${t}';vRep()`,d=new Date(),y=fd(Date.now()-864e5),mS=`${d.getFullYear()}-${pad(d.getMonth()+1)}-01`;
  $('#content').innerHTML=`<div class="stack"><div class="panel bar"><label class="f">من<input class="in" type="date" value="${U.rf}" onchange="U.rf=this.value;vRep()"></label><label class="f">إلى<input class="in" type="date" value="${U.rt}" onchange="U.rt=this.value;vRep()"></label><button class="btn sm" onclick="${q(today(),today())}">اليوم</button><button class="btn sm" onclick="${q(y,y)}">أمس</button><button class="btn sm" onclick="${q(mS,today())}">هذا الشهر</button></div>
  <div class="stats">${stat('إجمالي المبيعات',m(s.total),'hero',`${paid.length} فاتورة`)}${stat('كاش',m(s.cash),'cash')}${stat('شبكة',m(s.net),'net')}${stat('آجل',m(s.cr),'cr')}${stat('الضريبة المستحقة',m(s.vat))}${stat('المبيعات بعد الضريبة',m(netSales))}${stat('تكلفة المبيعات',m(s.cogs))}${stat('مجمل الربح',m(gross),'cash',netSales?(gross/netSales*100).toFixed(1)+'%':'')}${stat('المصروفات',m(expT),'bad')}${stat('الهدر وتسويات الجرد',m(adj-waste),'bad')}${stat('صافي الربح التشغيلي',m(np),np<0?'bad':'hero')}</div>
  <div class="row2" style="grid-template-columns:repeat(auto-fit,minmax(320px,1fr));align-items:start">
  <div class="panel"><h2>مبيعات الأصناف</h2><div class="tw"><table class="dt"><thead><tr><th>الصنف</th><th>الكمية</th><th>الإيراد</th><th>التكلفة</th><th>الربح</th></tr></thead><tbody>${Object.entries(im).sort((a,b)=>b[1].rev-a[1].rev).map(([k,v])=>`<tr><td>${esc(k)}</td><td class="n">${v.q}</td><td class="n">${m(v.rev)}</td><td class="n">${m(v.cost)}</td><td class="n">${m(v.rev/(1+(S.settings.vatIncluded?S.settings.vat/100:0))-v.cost)}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">لا مبيعات في هذه الفترة</td></tr>'}</tbody></table></div></div>
  <div class="stack"><div class="panel"><h2>المصروفات حسب البند</h2><table class="dt"><tbody>${Object.entries(ec).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<tr><td>${esc(k)}</td><td class="n">${m(v)}</td></tr>`).join('')||'<tr><td class="empty">لا مصروفات</td></tr>'}</tbody></table></div>
  <div class="panel"><h2>أرصدة العملاء (الآجل)</h2><table class="dt"><tbody>${Object.entries(recv).filter(([,v])=>v>.004).map(([k,v])=>`<tr><td>${esc(k)}</td><td class="n">${m(v)}</td><td><button class="btn sm" onclick="collectModal(${U.recv.push(k)-1},${r2(v)})">تحصيل</button></td></tr>`).join('')||'<tr><td class="empty">لا توجد أرصدة آجلة</td></tr>'}</tbody></table></div></div></div>
  <div class="panel"><h2>سجل إقفال اليوميات</h2><div class="tw"><table class="dt"><thead><tr><th>رقم</th><th>الفتح</th><th>الإقفال</th><th>بواسطة</th><th>المبيعات</th><th>المتوقع</th><th>الفعلي</th><th>الفرق</th><th></th></tr></thead><tbody>
  ${S.closings.slice().reverse().map(z=>`<tr><td class="n">${z.no}</td><td class="n">${fdt(z.openedAt)}</td><td class="n">${fdt(z.closedAt)}</td><td>${esc(z.closedBy)}</td><td class="n">${m(z.total)}</td><td class="n">${m(z.expected)}</td><td class="n">${m(z.counted)}</td><td class="n ${z.diff<0?'neg':z.diff>0?'pos':''}">${m(z.diff)}</td><td><button class="btn sm" onclick='printHTML(zrep(S.closings.find(x=>x.id==="${z.id}")))'>طباعة</button> <button class="btn sm" onclick='mailReport(S.closings.find(x=>x.id==="${z.id}"))'>إيميل</button></td></tr>`).join('')||'<tr><td colspan="9" class="empty">لا توجد يوميات مقفلة</td></tr>'}</tbody></table></div></div></div>`;

  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=fn;document.body.appendChild(a);a.click();a.remove();toast('حُفظ الملف '+fn);return true}

        if(QF[c]){const[n,f]=QF[c],old=FB.BQ[n+'/'+r.id];if(old!==undefined&&Math.abs(r[f]-old)>1e-9)deltas.push([c,r.id,r[f]-old])}});

function fbListen(){

}
function fbSeq(name,apply){if(!FB.ready||FB.state!=='online')return;FB.root.child('seq/'+name).transaction(c=>(c||1)+1).then(r=>{if(r&&r.committed)apply(r.snapshot.val()-1)}).catch(()=>{})}
function remoteChanged(c){saveLocal();saveBase();if(c==='users'&&U.user)U.user=S.users.find(u=>u.id===U.user.id&&u.active)||null;clearTimeout(FB.rt);FB.rt=setTimeout(refreshUI,250)}
function refreshUI(){
  if(!U.user){if(!U.loginUser)renderLogin();return}
  const ae=document.activeElement;if($('#modal').innerHTML||(ae&&/^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName))){clearTimeout(FB.rt);FB.rt=setTimeout(refreshUI,1500);return}
  if(U.view==='pos'&&S.day&&(U.cur||U.draft)){const o=cur();if(o&&o.status==='open'&&$('#cart')){renderCart();return}}
  render();
}

const VIEWS={cust:vCust,pos:vPOS,day:vDay,exp:vExp,pur:vPur,inv:vInv,items:vItems,rep:vRep,users:vUsers,set:vSet};
setInterval(()=>{if(U.user&&U.view==='pos'&&U.mode==='dine'&&!cur()&&!$('#modal').innerHTML)vPOS()},60000);
if(S.appVer!==APP_VERSION){if(S.appVer)setTimeout(()=>toast('تم تحديث النظام إلى الإصدار '+APP_VERSION),600);S.appVer=APP_VERSION;save()}
render();
fbInit();
</script>
